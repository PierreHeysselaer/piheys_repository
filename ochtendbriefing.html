<!DOCTYPE html>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Ochtendbriefing",
  "schemaVersion": 1,
  "description": "Dagelijkse ochtendbriefing voor Pierre: agenda, buitentemperatuur, link naar takenlijst. Haalt elke keer verse data op.",
  "mcpTools": [
    "mcp__Home_Assistant__GetLiveContext",
    "mcp__498d0ee3-34a0-487a-a776-c50a9346d81f__list_events"
  ],
  "mcpServerNames": [
    "Home_Assistant",
    "Google Calendar"
  ]
}
</script>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ochtendbriefing</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e2dfd8;
      --accent: #4a7c59;
      --accent-light: #eaf4ee;
      --text: #1a1a1a;
      --muted: #8a8680;
      --warm: #7c5a2a;
      --warm-light: #fdf3e7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px 16px 60px;
      max-width: 640px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
    }
    .datum {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .groet {
      font-size: 24px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.2;
    }
    .kaart {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }
    .kaart-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kaart-label svg {
      width: 14px;
      height: 14px;
      opacity: 0.6;
    }
    /* Weer */
    .temp-groot {
      font-size: 36px;
      font-weight: 400;
      color: var(--text);
      line-height: 1;
    }
    .temp-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    /* Afspraken */
    .afspraak {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .afspraak:last-child { border-bottom: none; padding-bottom: 0; }
    .afspraak:first-child { padding-top: 0; }
    .tijd-blok {
      min-width: 72px;
      text-align: right;
    }
    .tijd-start {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    .tijd-eind {
      font-size: 11px;
      color: var(--muted);
    }
    .afspraak-naam {
      font-size: 15px;
      color: var(--text);
      line-height: 1.4;
    }
    .afspraak-detail {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      line-height: 1.4;
    }
    .geen {
      font-size: 15px;
      color: var(--muted);
      font-style: italic;
    }
    /* Taken link */
    .taken-tekst {
      font-size: 15px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .taken-knop {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--accent-light);
      color: var(--accent);
      border: 1px solid #b8dfc5;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }
    .taken-knop:hover { background: #d5eddd; }
    /* Laden */
    .laden {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      padding: 8px 0;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fout { color: #c0392b; font-size: 13px; }
    /* Scheidingslijn */
    .dag-streep {
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
      min-height: 36px;
      margin-top: 2px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="datum" id="datum-tekst">Laden…</div>
  <div class="groet">Goedemorgen, Pierre.</div>
</header>

<div class="kaart" id="weer-kaart">
  <div class="kaart-label">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    Temperatuur
  </div>
  <div class="laden"><div class="spinner"></div> Ophalen…</div>
</div>

<div class="kaart" id="agenda-kaart">
  <div class="kaart-label">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    Agenda vandaag
  </div>
  <div class="laden"><div class="spinner"></div> Ophalen…</div>
</div>

<div class="kaart">
  <div class="kaart-label">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    Taken
  </div>
  <p class="taken-tekst">Je dagelijkse taken staan klaar in de Concierge takenlijst.</p>
  <a class="taken-knop" onclick="window.cowork && window.cowork.openArtifact ? window.cowork.openArtifact('concierge-takenlijst') : null" href="#">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-4"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    Open takenlijst
  </a>
</div>

<script>
const DAGEN = ['Zondag','Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag'];
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

function fmtDatum(d) {
  return `${DAGEN[d.getDay()]} · ${d.getDate()} ${MAANDEN[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtTijd(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit', hour12: false });
}

const nu = new Date();
document.getElementById('datum-tekst').textContent = fmtDatum(nu);

async function laadWeer() {
  const kaart = document.getElementById('weer-kaart');
  try {
    const r = await window.cowork.callMcpTool('mcp__Home_Assistant__GetLiveContext', {});
    const data = r.structuredContent ?? JSON.parse(r.content[0].text);
    const tekst = data.result || '';

    let buitenTemp = null;
    // Zoek tuin plantsensor
    const tuinMatch = tekst.match(/Plant Sensor[^]*?state:\s*'([\d.]+)'[^]*?unit_of_measurement:\s*°C/);
    if (tuinMatch) buitenTemp = parseFloat(tuinMatch[1]);

    // Fallback: eerste buiten-gerelateerde sensor
    if (!buitenTemp) {
      const tempMatches = [...tekst.matchAll(/names:\s*(.+?)\n[^]*?state:\s*'([\d.]+)'[^]*?unit_of_measurement:\s*°C/g)];
      for (const m of tempMatches) {
        if (m[1].toLowerCase().includes('tuin') || m[1].toLowerCase().includes('buiten')) {
          buitenTemp = parseFloat(m[2]);
          break;
        }
      }
    }

    const binnenTemps = [];
    const tadoMatches = [...tekst.matchAll(/tado[^]*?Current Temperature\n[^]*?state:\s*'([\d.]+)'/g)];
    for (const m of tadoMatches) binnenTemps.push(parseFloat(m[1]));
    const binnenGem = binnenTemps.length ? (binnenTemps.reduce((a,b)=>a+b,0)/binnenTemps.length).toFixed(1) : null;

    let html = '<div class="kaart-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg> Temperatuur</div>';
    if (buitenTemp !== null) {
      html += `<div class="temp-groot">${buitenTemp.toFixed(1).replace('.',',')} °C</div>`;
      html += `<div class="temp-sub">buiten (tuin)`;
      if (binnenGem) html += ` &nbsp;·&nbsp; ${binnenGem.replace('.',',')} °C binnen`;
      html += `</div>`;
    } else if (binnenGem) {
      html += `<div class="temp-groot">${binnenGem.replace('.',',')} °C</div><div class="temp-sub">binnentemperatuur (gemiddeld)</div>`;
    } else {
      html += `<p class="fout">Temperatuur niet beschikbaar.</p>`;
    }
    kaart.innerHTML = html;
  } catch(e) {
    kaart.innerHTML = '<div class="kaart-label">Temperatuur</div><p class="fout">Kon temperatuur niet ophalen.</p>';
  }
}

async function laadAgenda() {
  const kaart = document.getElementById('agenda-kaart');
  try {
    const vandaag = new Date();
    const start = new Date(vandaag); start.setHours(0,0,0,0);
    const eind = new Date(vandaag); eind.setHours(23,59,59,999);

    const r = await window.cowork.callMcpTool('mcp__498d0ee3-34a0-487a-a776-c50a9346d81f__list_events', {
      startTime: start.toISOString(),
      endTime: eind.toISOString(),
      timeZone: 'Europe/Brussels',
      orderBy: 'startTime'
    });
    const data = r.structuredContent ?? JSON.parse(r.content[0].text);
    const events = data.events || [];

    let html = '<div class="kaart-label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Agenda vandaag</div>';

    if (events.length === 0) {
      html += '<p class="geen">Geen afspraken vandaag.</p>';
    } else {
      for (const ev of events) {
        const startT = ev.start?.dateTime ? fmtTijd(ev.start.dateTime) : 'Hele dag';
        const eindT = ev.end?.dateTime ? fmtTijd(ev.end.dateTime) : '';
        const desc = ev.description ? ev.description.replace(/\n/g, ' · ').substring(0, 120) : '';
        html += `<div class="afspraak">
          <div class="dag-streep"></div>
          <div style="flex:1">
            <div class="afspraak-naam">${ev.summary || '(geen titel)'}</div>
            <div class="afspraak-detail">${startT}${eindT ? ' – ' + eindT : ''}${desc ? ' &nbsp;·&nbsp; ' + desc : ''}</div>
          </div>
        </div>`;
      }
    }
    kaart.innerHTML = html;
  } catch(e) {
    kaart.innerHTML = '<div class="kaart-label">Agenda vandaag</div><p class="fout">Kon agenda niet ophalen.</p>';
  }
}

laadWeer();
laadAgenda();
</script>
</body>
</html>
