<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Concierge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{max-width:100%;overflow-x:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f7f5;color:#111;
     font-size:16px;max-width:1000px;margin:0 auto;padding:0 0 60px;}

#kop{padding:26px 18px 20px;}
.titel{font-size:27px;font-weight:600;letter-spacing:-.01em;}
.datum{font-size:15px;color:#8d8d8d;margin-top:5px;text-transform:capitalize;}
.weerbalk{display:flex;align-items:center;gap:9px;margin-top:14px;background:#fff;
          border:1px solid #e8e6e1;border-radius:11px;padding:11px 14px;font-size:15px;color:#555;}
.weerbalk .ic{font-size:19px;}
.weerbalk .los{color:#aaa;font-size:13.5px;}

#agenda{margin:0 18px 6px;background:#fff;border:1px solid #e8e6e1;border-radius:12px;padding:13px 16px;}
#agenda .kopje{font-size:11.5px;font-weight:700;color:#999;text-transform:uppercase;
               letter-spacing:.06em;margin-bottom:8px;}
.ag{display:flex;gap:12px;align-items:baseline;padding:4px 0;}
.ag .t{font-size:13.5px;color:#4a7c59;font-weight:600;min-width:66px;flex-shrink:0;}
.ag .x{font-size:15.5px;color:#444;line-height:1.3;}

#tegels{padding:12px 18px 0;display:flex;flex-direction:column;gap:11px;}
.tegel{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #e8e6e1;
       border-radius:14px;padding:18px 19px;transition:border-color .15s,transform .08s;}
.tegel:active{border-color:#4a7c59;transform:scale(.995);}
.tegel-rij{display:flex;align-items:center;gap:15px;}
.ic-vak{width:46px;height:46px;flex-shrink:0;border-radius:12px;background:#eaf4ee;
        display:flex;align-items:center;justify-content:center;font-size:23px;}
.tegel-naam{font-size:19px;font-weight:600;}
.tegel-sub{font-size:14px;color:#999;margin-top:2px;}
.tegel-sub.let{color:#c0392b;font-weight:600;}
.pijl{margin-left:auto;color:#ccc;font-size:20px;flex-shrink:0;}

.duo{display:flex;gap:9px;margin-top:13px;padding-top:13px;border-top:1px solid #f2f1ec;}
.duo a{flex:1;text-align:center;text-decoration:none;padding:11px;border:1px solid #e5e3de;
       border-radius:9px;font-size:15px;color:#555;background:#fafaf8;}
.duo a:active{border-color:#4a7c59;color:#4a7c59;background:#eaf4ee;}

#voet{text-align:center;font-size:12.5px;color:#c2c2c2;padding:26px 18px 0;}
</style>
</head>
<body>

<div id="kop">
  <div class="titel">Concierge</div>
  <div class="datum" id="datum"></div>
  <div class="weerbalk" id="weerbalk" style="display:none;">
    <span class="ic" id="w-ic"></span>
    <span id="w-tekst"></span>
    <span class="los" id="w-los"></span>
  </div>
</div>

<div id="agenda" style="display:none;">
  <div class="kopje">Vandaag in de agenda</div>
  <div id="agenda-lijst"></div>
</div>

<div id="tegels">

  <a class="tegel" href="boodschappenlijst.html">
    <div class="tegel-rij">
      <div class="ic-vak">🛒</div>
      <div>
        <div class="tegel-naam">Boodschappen</div>
        <div class="tegel-sub" id="sub-bood">aanstiplijst en winkellijst</div>
      </div>
      <div class="pijl">›</div>
    </div>
  </a>

  <a class="tegel" href="taken.html">
    <div class="tegel-rij">
      <div class="ic-vak">🌿</div>
      <div>
        <div class="tegel-naam">Taken</div>
        <div class="tegel-sub" id="sub-taken">wat kan er vandaag</div>
      </div>
      <div class="pijl">›</div>
    </div>
  </a>

  <div class="tegel">
    <div class="tegel-rij">
      <div class="ic-vak">💊</div>
      <div>
        <div class="tegel-naam">Medicijnen</div>
        <div class="tegel-sub" id="sub-med">voorraad en weekdoosje</div>
      </div>
    </div>
    <div class="duo">
      <a href="medicatie_pierre.html">Pierre</a>
      <a href="medicatie_bea.html">Bea</a>
    </div>
  </div>

</div>

<div id="voet">bijgewerkt <span id="voet-tijd">–</span></div>

<script>
/* ============================================================
   Concierge — beginpagina
   Puur een vertrekpunt. Alles wat hieronder gebeurt is
   versiering: lukt het laden niet, dan blijven de knoppen
   gewoon werken.
   ============================================================ */

const REPO = 'PierreHeysselaer/piheys_repository';
const TOKEN = ['github_pat_11AYGGRYA0mx','BmzBHFY6TP_XD','TD4hfTIO1fvuM2paNJ7R1OT',
               'qXyBYmOo1ajP7nPoIY4IQAOPI5MKdiSTkP'].join('');
const API = n => `https://api.github.com/repos/${REPO}/contents/${n}`;
const H = () => ({Authorization:`Bearer ${TOKEN}`, Accept:'application/vnd.github.v3+json'});

const DAGEN = ['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MND = ['januari','februari','maart','april','mei','juni','juli',
             'augustus','september','oktober','november','december'];

const dstr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const VANDAAG = dstr(new Date());
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function vanB64(c){ return new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,'')), x=>x.charCodeAt(0))); }

/* datum meteen tonen, ook zonder netwerk */
(function(){
  const d = new Date();
  document.getElementById('datum').textContent =
    `${DAGEN[d.getDay()]} ${d.getDate()} ${MND[d.getMonth()]}`;
})();

async function haal(naam){
  try {
    const r = await fetch(API(naam)+'?t='+Date.now(), {headers:H(), cache:'no-store'});
    if (!r.ok) return null;
    return JSON.parse(vanB64((await r.json()).content));
  } catch(e){ return null; }
}

/* dagen voorraad — zelfde regel als de medicatiepagina:
   wat er ligt, min het verbruik sinds de peildatum         */
function dagenVoorraad(m){
  const perDag = +m.doses_per_dag || 0;
  if (!perDag) return 9999;
  const basis = +m.stock_thuis || 0;
  const vanaf = m.stock_bijgewerkt_op || VANDAAG;
  const dagen = Math.max(0, Math.round(
    (new Date(VANDAAG+'T12:00:00') - new Date(vanaf+'T12:00:00'))/86400000));
  const nu = Math.max(0, basis - dagen*perDag);
  const totaal = nu + (+m.dozen_apotheek||0) * (+m.units_per_doos||0);
  return Math.floor(totaal / perDag);
}

const BEKENDE_PAGINAS = new Set(['index.html','boodschappenlijst.html','taken.html',
                                 'medicatie_pierre.html','medicatie_bea.html',
                                 'app.html','ochtendbriefing.html']);

async function lijstRepo(){
  try {
    const r = await fetch(API('')+'?t='+Date.now(), {headers:H(), cache:'no-store'});
    if (!r.ok) return [];
    return await r.json();
  } catch(e){ return []; }
}

async function vul(){
  const [status, dag, brief, repoFiles] = await Promise.all([
    haal('status.json'), haal('dag.json'), haal('briefing.json'), lijstRepo()
  ]);
  const extra = Array.isArray(repoFiles)
    ? repoFiles
        .filter(f => f.type==='file' && f.name.endsWith('.html') && !BEKENDE_PAGINAS.has(f.name))
        .map(f => ({bestand:f.name, titel:f.name.replace(/\.html$/,'').replace(/-/g,' '), ic:'📄'}))
    : [];

  /* --- weer --- */
  if (dag && dag.dagen){
    const w = dag.dagen.find(x => x.datum === VANDAAG);
    if (w){
      document.getElementById('w-ic').textContent =
        w.type === 'regen' ? '🌧️' : w.type === 'bewolkt' ? '☁️' : '☀️';
      document.getElementById('w-tekst').textContent =
        `${w.temp_min}° tot ${w.temp_max}°` + (w.regen_mm > 0 ? `, ${w.regen_mm} mm regen` : ', droog');
      document.getElementById('w-los').textContent =
        `wind ${w.wind_max_kmu} km/u`;
      document.getElementById('weerbalk').style.display = 'flex';
    }
  }

  /* --- agenda uit de briefing --- */
  if (brief && brief.datum === VANDAAG && brief.agenda && brief.agenda.length){
    document.getElementById('agenda-lijst').innerHTML = brief.agenda.map(a =>
      `<div class="ag"><span class="t">${esc(a.tijd||'')}</span>
       <span class="x">${esc(a.tekst)}</span></div>`).join('');
    document.getElementById('agenda').style.display = 'block';
  }

  if (!status) return;

  /* --- boodschappen --- */
  const gekozen = (status.boodschappen && status.boodschappen.aangevinkt) || [];
  document.getElementById('sub-bood').textContent = gekozen.length
    ? `${gekozen.length} artikel${gekozen.length===1?'':'en'} op de lijst`
    : 'lijst is leeg';

  /* --- taken: alleen wat vandaag al afgevinkt is --- */
  const log = status.taken_log || {};
  const vandaagGedaan = Object.values(log)
    .filter(l => Array.isArray(l) && l[l.length-1] === VANDAAG).length;
  document.getElementById('sub-taken').textContent = vandaagGedaan
    ? `${vandaagGedaan} vandaag afgevinkt`
    : 'wat kan er vandaag';

  /* --- medicijnen: enkel waarschuwen als het krap wordt --- */
  const alle = [...(status.medicatie_pierre||[]), ...(status.medicatie_bea||[])];
  const krap = alle.filter(m => dagenVoorraad(m) < 21);
  const el = document.getElementById('sub-med');
  if (krap.length){
    el.textContent = krap.length === 1
      ? `${krap[0].naam} raakt op`
      : `${krap.length} medicijnen raken op`;
    el.classList.add('let');
  }

  if (status.gewijzigd){
    const d = new Date(status.gewijzigd);
    document.getElementById('voet-tijd').textContent =
      `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }

  /* --- extra pagina's (bijv. reiskaarten) --- */
  const BASE   = `https://pierreheysselaer.github.io/piheys_repository/`;
  if (Array.isArray(extra) && extra.length){
    const tegels = document.getElementById('tegels');
    for (const p of extra){
      if (!p.bestand || BEKENDE_PAGINAS.has(p.bestand)) continue;
      const a = document.createElement('a');
      a.className = 'tegel';
      a.href = BASE + p.bestand;
      a.innerHTML =
        `<div class="tegel-rij">
           <div class="ic-vak">${esc(p.ic||'📄')}</div>
           <div>
             <div class="tegel-naam">${esc(p.titel||p.bestand)}</div>
             <div class="tegel-sub">extra pagina</div>
           </div>
           <div class="pijl">›</div>
         </div>`;
      tegels.appendChild(a);
    }
  }
}

vul();
</script>
</body>
</html>
