*{box-sizing:border-box;margin:0;padding:0;}
html,body{max-width:100%;overflow-x:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f7f5;color:#111;padding-bottom:80px;}
#header{background:#fff;border-bottom:1px solid #e5e3de;padding:10px 12px 0;position:sticky;top:0;z-index:20;}
#header h1{font-size:16px;font-weight:500;margin-bottom:8px;}
#search-wrap{margin-bottom:8px;}
#search{width:100%;font-size:15px;padding:7px 10px;border:1px solid #ddd;border-radius:8px;background:#fafaf8;}
#tabbar{display:flex;}
.tab{padding:8px 14px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-size:14px;color:#888;font-weight:400;}
.tab.active{color:#1a6bc4;border-bottom-color:#1a6bc4;font-weight:500;}
#badge{display:inline-block;background:#1a6bc4;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:5px;vertical-align:middle;}
#app{padding:8px 10px 0;width:100%;}
.cat-block{margin-bottom:4px;border:1px solid #e8e6e1;border-radius:8px;overflow:hidden;background:#fff;}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;background:#f2f1ec;user-select:none;}
.cat-head span.label{font-size:13px;font-weight:500;text-transform:capitalize;}
.cat-head span.cnt{font-size:11px;color:#aaa;}
.cat-head .arr{font-size:11px;color:#bbb;transition:transform .15s;}
.cat-head.open .arr{transform:rotate(90deg);}
.cat-items{display:none;}
.cat-items.open{display:block;}
.item-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #f0ede8;}
.item-row input{width:20px;height:20px;cursor:pointer;accent-color:#1a6bc4;flex-shrink:0;}
.item-row .name{flex:1;font-size:14px;line-height:1.3;word-break:break-word;}
.item-row .specs{font-size:12px;color:#aaa;display:block;}
.item-row .opm{font-size:11px;color:#c47f00;}
.item-row.checked .name{color:#ccc;text-decoration:line-through;}
/* Winkellijst */
.store-block{margin-bottom:16px;}
.store-hd{display:flex;align-items:center;justify-content:space-between;background:#eae8e2;border-radius:8px;padding:10px 12px;margin-bottom:2px;}
.store-hd .sname{font-size:16px;font-weight:500;}
.store-hd .scnt{font-size:12px;color:#888;}
.store-hd.closed{opacity:.55;}
.wclosed{font-size:11px;color:#c47f00;font-weight:400;margin-left:6px;}
.wrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f0ede8;background:#fff;}
.wrow:first-child{border-top:1px solid #f0ede8;}
.wrow input{width:20px;height:20px;cursor:pointer;accent-color:#1a6bc4;flex-shrink:0;}
.wrow.dimmed{opacity:.35;}
.wrow.wdone .wname{text-decoration:line-through;color:#bbb;}
.wname{flex:1;font-size:14px;word-break:break-word;}
.wspecs{font-size:12px;color:#aaa;}
.wnote{font-size:11px;color:#c47f00;margin-left:4px;}
.wcheck{color:#2a9d5c;font-size:15px;}
#empty{text-align:center;padding:40px 0;color:#bbb;font-size:15px;}
#actions{width:100%;margin:12px auto 0;padding:0 10px;}
.confirm-btn{width:100%;font-size:15px;padding:13px;border:1px solid #ddd;border-radius:9px;cursor:pointer;background:#fff;color:#111;}
/* Sync */
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ccc;margin-right:3px;vertical-align:middle;}
.sync-dot.ok{background:#4a7c59;}
.sync-dot.bezig{background:#e6a817;animation:sdpulse 1s infinite;}
.sync-dot.fout{background:#c0392b;}
@keyframes sdpulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>

const CAT_ORDER = ["leeggoed", "special", "snack", "maaltijd", "keuken", "groenten", "vlees", "vis", "beleg", "brood", "ontbijt", "fruit", "kruiden", "drank", "melk", "sausen ed", "persoonlijk", "vaatwas", "was", "dier", "logistiek", "onderhoud", "rest", "batterijen"];

const STORE_CLOSED_UNTIL = { 'Bakker': '2026-08-05' };
const TODAY = new Date();

// ===== GITHUB SYNC =====
const REPO = 'PierreHeysselaer/piheys_repository';
const BESTAND = 'data.json';
const TOKEN = ['github_pat_11AYGGRYA0mx','BmzBHFY6TP_XD','TD4hfTIO1fvuM2paNJ7R1OT','qXyBYmOo1ajP7nPoIY4IQAOPI5MKdiSTkP'].join('');
const API_URL = `https://api.github.com/repos/${REPO}/contents/${BESTAND}`;

let huidigeSha = null;
let syncData = {};
let saveTimer = null;

function setSyncStatus(status, tekst) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot ' + status;
  document.getElementById('sync-tekst').textContent = tekst;
}

function naarBase64(tekst) {
  const bytes = new TextEncoder().encode(tekst);
  let binair = '';
  bytes.forEach(b => binair += String.fromCharCode(b));
  return btoa(binair);
}

async function laadData() {
  setSyncStatus('bezig', 'laden…');
  try {
    const r = await fetch(API_URL, {
      headers: { Authorization: `Bearer ${TOKEN}`, Accept: 'application/vnd.github.v3+json' }
    });
    if (r.status === 404) {
      huidigeSha = null;
      syncData = {};
      setSyncStatus('ok', 'nieuw');
      return;
    }
    if (!r.ok) throw new Error(r.status);
    const json = await r.json();
    huidigeSha = json.sha;
    syncData = JSON.parse(atob(json.content.replace(/\n/g, '')));
    if (syncData.boodschappen_geselecteerd) {
      selected.clear();
      syncData.boodschappen_geselecteerd.forEach(n => selected.add(n));
      render();
    }
    setSyncStatus('ok', 'gesynchroniseerd');
  } catch(e) {
    setSyncStatus('fout', 'fout bij laden');
    console.error('Laden mislukt:', e);
  }
}

async function slaOp() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  setSyncStatus('bezig', 'opslaan…');
  try {
    syncData.boodschappen_geselecteerd = [...selected];
    const inhoud = naarBase64(JSON.stringify(syncData, null, 2));
    const body = { message: 'boodschappen update', content: inhoud };
    if (huidigeSha) body.sha = huidigeSha;
    const r = await fetch(API_URL, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${TOKEN}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      if (r.status === 409 || r.status === 422) {
        await laadData();
        return;
      }
      const fout = await r.json().catch(() => ({}));
      throw new Error(`${r.status}: ${fout.message || ''}`);
    }
    const json = await r.json();
    huidigeSha = json.content.sha;
    setSyncStatus('ok', 'opgeslagen ✓');
    setTimeout(() => setSyncStatus('ok', 'gesynchroniseerd'), 2500);
  } catch(e) {
    setSyncStatus('fout', 'fout bij opslaan');
    console.error('Opslaan mislukt:', e);
  }
}

function saveDebounced() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => slaOp(), 2000);
}

function herlaad() {
  laadData();
}

// ===== WINKEL LOGIC =====
function storeOpen(s) {
  if (!STORE_CLOSED_UNTIL[s]) return true;
  return TODAY > new Date(STORE_CLOSED_UNTIL[s]);
}
function closedLabel(s) {
  const d = new Date(STORE_CLOSED_UNTIL[s]);
  return `gesloten t/m ${d.getDate()}/${d.getMonth()+1}`;
}

// ===== STATE =====
const selected = new Set(["oude batterijen en bruisgasflessen leeg","entrecôte rund","dikke ribbetjes","kruidenboter","gorgonzola","spoelmiddel vaatwas","zwarte schoensmeer","reinigingspray ruiten open haard","AA-batterijen","zalm","vaatwastabletten","spek sneden","americain prepare","martino"]);
const winkDone = new Set();
let currentTab = 'aanstip';
let searchQ = '';

function setTab(t) { currentTab = t; render(); }
function filterItems(q) { searchQ = q.toLowerCase().trim(); render(); }

function toggleSelect(naam) {
  if (selected.has(naam)) selected.delete(naam);
  else selected.add(naam);
  winkDone.delete(naam);
  renderBadge(); renderActions();
  const cb = document.getElementById('cb_' + CSS.escape(naam));
  if (cb) { cb.checked = selected.has(naam); cb.closest('.item-row').classList.toggle('checked', selected.has(naam)); }
  saveDebounced();
}

function toggleWinkDone(naam) {
  if (winkDone.has(naam)) winkDone.delete(naam);
  else winkDone.add(naam);
  renderWinkel();
  renderActions();
}

function renderBadge() { document.getElementById('badge').textContent = selected.size; }

function resetLijst() {
  if (!confirm('Alle aangestipte artikelen wissen?')) return;
  selected.clear(); winkDone.clear();
  render();
  slaOp();
}

function confirmDone() {
  const allDone = [...selected];
  selected.clear(); winkDone.clear();
  render();
  slaOp();
}

function renderActions() {
  const ac = document.getElementById('actions');
  if (currentTab === 'winkel' && selected.size > 0) {
    const doneCount = winkDone.size;
    ac.innerHTML = doneCount > 0
      ? `<button class="confirm-btn" onclick="confirmDone()">✓ Klaar — verwijder ${selected.size} artikel${selected.size > 1 ? 'en' : ''} uit lijst</button>`
      : '';
  } else { ac.innerHTML = ''; }
}

function renderAanstip() {
  const ap = document.getElementById('app');
  let cats = CAT_ORDER;
  if (searchQ) {
    const matched = new Set(ALL_ITEMS.filter(i => i.naam.toLowerCase().includes(searchQ) || i.specs.toLowerCase().includes(searchQ)).map(i => i.cat));
    cats = CAT_ORDER.filter(c => matched.has(c));
  }
  if (!cats.length) { ap.innerHTML = '<p style="text-align:center;padding:40px;color:#bbb;">Geen resultaten</p>'; return; }
  ap.innerHTML = cats.map(cat => {
    let items = ALL_ITEMS.filter(i => i.cat === cat);
    if (searchQ) items = items.filter(i => i.naam.toLowerCase().includes(searchQ) || i.specs.toLowerCase().includes(searchQ));
    if (!items.length) return '';
    const selInCat = items.filter(i => selected.has(i.naam)).length;
    return `<div class="cat-block">
      <div class="cat-head${searchQ ? ' open' : ''}" onclick="toggleCat(this)">
        <span class="label">${cat}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          ${selInCat > 0 ? `<span style="font-size:11px;color:#1a6bc4;font-weight:500;">${selInCat} gekozen</span>` : ''}
          <span class="cnt">${items.length}</span>
          <span class="arr">▶</span>
        </span>
      </div>
      <div class="cat-items${searchQ ? ' open' : ''}">
        ${items.map(it => `
          <div class="item-row${selected.has(it.naam) ? ' checked' : ''}">
            <input type="checkbox" id="cb_${it.naam.replace(/"/g, '')}" ${selected.has(it.naam) ? 'checked' : ''} onchange="toggleSelect('${it.naam.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')">

            ${it.opm ? `<span class="opm">${it.opm}</span>` : ''}
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleCat(head) {
  head.classList.toggle('open');
  head.nextElementSibling.classList.toggle('open');
}

function renderWinkel() {
  const ap = document.getElementById('app');
  if (selected.size === 0) { ap.innerHTML = '<div id="empty">Nog niets aangevinkt.<br>Ga naar de aanstiplijst.</div>'; renderActions(); return; }

  const byStore = {};
  STORE_ORDER.forEach(s => byStore[s] = []);

  const selItems = ALL_ITEMS.filter(i => selected.has(i.naam));
  selItems.forEach(it => {
    const open = storeOpen(it.pref);
    if (open) {
      byStore[it.pref] = byStore[it.pref] || [];
      byStore[it.pref].push({...it, _note: null, _fb: false});
      if (it.backup) {
        byStore[it.backup] = byStore[it.backup] || [];
        byStore[it.backup].push({...it, _note: `al bij ${it.pref} gekocht?`, _fb: true});
      }
    } else {
      const fb = it.backup || 'OKAY';
      byStore[fb] = byStore[fb] || [];
      byStore[fb].push({...it, _note: `${it.pref} ${closedLabel(it.pref)}`, _fb: false});
    }
  });

  const activeStores = STORE_ORDER.filter(s => byStore[s] && byStore[s].length);
  ap.innerHTML = activeStores.map(store => {
    const si = byStore[store];
    const main = si.filter(i => !i._fb).sort((a, b) => a.volgw - b.volgw);
    const fb = si.filter(i => i._fb).sort((a, b) => a.volgw - b.volgw);
    const done = main.filter(i => winkDone.has(i.naam));
    const todo = main.filter(i => !winkDone.has(i.naam));
    const open = storeOpen(store);
    return `<div class="store-block">
      <div class="store-hd${open ? '' : ' closed'}">
        <span class="sname">🛒 ${store}${!open ? `<span class="wclosed">${closedLabel(store)}</span>` : ''}</span>
        <span class="scnt">${done.length}/${main.length}</span>
      </div>
      ${[...todo, ...done, ...fb].map(it => `
        <div class="wrow${it._fb ? ' dimmed' : ''}${winkDone.has(it.naam) ? ' wdone' : ''}">
          <input type="checkbox" ${winkDone.has(it.naam) ? 'checked' : ''} ${it._fb ? 'disabled' : ''} onchange="toggleWinkDone('${it.naam.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')">
          <span class="wname">${it.naam}${it.specs ? `<span class="wspecs"> — ${it.specs}</span>` : ''}${it._note ? `<span class="wnote">(${it._note})</span>` : ''}</span>
          ${winkDone.has(it.naam) ? '<span class="wcheck">✓</span>' : ''}
        </div>`).join('')}
    </div>`;
  }).join('');
  renderActions();
}

function render() {
  renderBadge();
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === (currentTab === 'aanstip' ? 0 : 1)));
  document.getElementById('search-wrap').style.display = currentTab === 'aanstip' ? 'block' : 'none';
  if (currentTab === 'aanstip') renderAanstip();
  else renderWinkel();
  renderActions();
}
