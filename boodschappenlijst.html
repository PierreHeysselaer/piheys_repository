<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Boodschappen</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{max-width:100%;overflow-x:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f7f5;color:#111;
     padding-bottom:90px;font-size:16px;max-width:1000px;margin:0 auto;}
#header{background:#fff;border-bottom:1px solid #e5e3de;padding:10px 12px 0;position:sticky;top:0;z-index:20;}
.kop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;margin-right:4px;
          vertical-align:middle;transition:background .3s;}
.sync-dot.ok{background:#4a7c59;} .sync-dot.bezig{background:#e6a817;animation:p 1s infinite;}
.sync-dot.fout{background:#c0392b;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
#zoek{width:100%;font-size:16px;padding:9px 12px;border:1px solid #ddd;border-radius:9px;background:#fafaf8;
      outline:none;margin-bottom:9px;}
#zoek:focus{border-color:#4a7c59;}
.tabs{display:flex;border-bottom:1px solid #e5e3de;margin:0 -12px;}
.tab{flex:1;text-align:center;padding:11px 0;background:none;border:none;border-bottom:2px solid transparent;
     cursor:pointer;font-size:15px;color:#999;}
.tab.aan{color:#111;border-bottom-color:#4a7c59;font-weight:600;}
.telbadge{display:inline-block;background:#4a7c59;color:#fff;border-radius:10px;font-size:12px;
          padding:1px 7px;margin-left:5px;vertical-align:middle;}
#wrap{padding:10px 12px 0;}

.cat{border:1px solid #e8e6e1;border-radius:11px;margin-bottom:7px;background:#fff;overflow:hidden;}
.cat-kop{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;cursor:pointer;gap:8px;}
.cat-naam{font-size:16px;font-weight:600;text-transform:capitalize;}
.cat-tel{font-size:12.5px;color:#bbb;}
.cat-tel .gekozen{color:#4a7c59;font-weight:600;}
.cat-body{display:none;border-top:1px solid #f2f1ec;}
.cat.open .cat-body{display:block;}
.pijl{font-size:12px;color:#bbb;transition:transform .15s;}
.cat.open .pijl{transform:rotate(90deg);}

.art{display:flex;align-items:center;gap:13px;padding:11px 15px;border-top:1px solid #f7f7f5;cursor:pointer;}
.art:first-child{border-top:none;}
.art.aan{background:#eaf4ee;}
.vk{width:24px;height:24px;flex-shrink:0;border:2px solid #ddd;border-radius:6px;display:flex;
    align-items:center;justify-content:center;transition:.15s;}
.art.aan .vk{background:#4a7c59;border-color:#4a7c59;}
.art.aan .vk::after{content:'✓';color:#fff;font-size:14px;font-weight:700;}
.art-naam{flex:1;font-size:16px;line-height:1.3;word-break:break-word;}
.art-naam small{display:block;font-size:13px;color:#aaa;margin-top:1px;}
.merk{font-size:11px;background:#eaf4ee;color:#4a7c59;border-radius:6px;padding:1px 6px;margin-left:5px;
      vertical-align:middle;white-space:nowrap;}
.merk.nw{background:#fdecea;color:#c0392b;}

.winkel{margin-bottom:16px;}
.w-kop{display:flex;align-items:baseline;justify-content:space-between;gap:9px;padding:0 3px 8px;flex-wrap:wrap;}
.w-naam{font-size:18px;font-weight:600;}
.w-uren{font-size:13px;color:#888;}
.w-uren.dicht{color:#c47f00;font-weight:600;}
.w-tel{font-size:13px;color:#aaa;}
.w-lijst{background:#fff;border:1px solid #e8e6e1;border-radius:11px;overflow:hidden;}
.w-art{display:flex;align-items:center;gap:13px;padding:12px 15px;border-top:1px solid #f7f7f5;cursor:pointer;}
.w-art:first-child{border-top:none;}
.w-art.af{opacity:.42;} .w-art.af .w-naam2{text-decoration:line-through;}
.w-naam2{flex:1;font-size:16px;word-break:break-word;}
.w-naam2 small{display:block;font-size:13px;color:#aaa;}
.w-let{font-size:12.5px;color:#c47f00;margin-top:2px;display:block;}
.leeg{text-align:center;color:#c0c0c0;font-size:15px;padding:44px 0;font-style:italic;}

.toevoeg{background:#fff;border:1px solid #e8e6e1;border-radius:11px;padding:15px;margin-top:10px;}
.t-titel{font-size:15px;font-weight:600;margin-bottom:11px;}
.fg{margin-bottom:11px;}
.fl{display:block;font-size:11.5px;font-weight:600;color:#888;text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:5px;}
.fi{width:100%;padding:11px 13px;border:1px solid #ddd;border-radius:8px;font-size:16px;
    background:#fafaf8;outline:none;}
.fi:focus{border-color:#4a7c59;}
.duo{display:flex;gap:9px;} .duo>div{flex:1;}
.bp{width:100%;padding:13px;background:#4a7c59;color:#fff;border:none;border-radius:9px;font-size:16px;
    font-weight:600;cursor:pointer;}
.hint{font-size:12.5px;color:#aaa;margin-top:6px;line-height:1.4;}
.wisknop{width:100%;padding:12px;border:1px solid #e5e3de;border-radius:9px;background:#fff;color:#999;
         font-size:15px;cursor:pointer;margin-top:12px;}
.wisknop:active{color:#c0392b;border-color:#f3c4bd;}
</style>
</head>
<body>

<div id="header">
  <div class="kop">
    <div style="display:flex;align-items:center;gap:9px;min-width:0;">
      <span style="font-size:17px;font-weight:500;">Boodschappen</span>
      <span><span class="sync-dot" id="dot"></span><span id="sync" style="font-size:12px;color:#aaa;">–</span></span>
    </div>
    <button onclick="laadAlles()" style="font-size:14px;padding:6px 11px;border:1px solid #ddd;
      border-radius:7px;background:#fff;color:#888;cursor:pointer;">↻</button>
  </div>
  <input id="zoek" type="search" placeholder="Zoeken…" autocomplete="off" oninput="teken()">
  <div class="tabs">
    <button class="tab aan" id="tab-a" onclick="naarTab('aanstip')">Aanstiplijst</button>
    <button class="tab" id="tab-w" onclick="naarTab('winkel')">Winkellijst<span class="telbadge"
      id="badge" style="display:none;">0</span></button>
  </div>
</div>

<div id="wrap"><div id="inhoud"></div></div>

<script>
/* ============================================================
   Concierge — boodschappen  (Pierre en Bea)
   ============================================================ */

const REPO = 'PierreHeysselaer/piheys_repository';
const TOKEN = ['github_pat_11AYGGRYA0mx','BmzBHFY6TP_XD','TD4hfTIO1fvuM2paNJ7R1OT',
               'qXyBYmOo1ajP7nPoIY4IQAOPI5MKdiSTkP'].join('');
const API = n => `https://api.github.com/repos/${REPO}/contents/${n}`;
const H = () => ({Authorization:`Bearer ${TOKEN}`, Accept:'application/vnd.github.v3+json'});
const MIJN = ['boodschappen'];
const KORT = ['zo','ma','di','wo','do','vr','za'];

let CAT = null, CONFIG = null, STATUS = null;
let sha = null, bezig = false, nogEens = false;
let tab = 'aanstip', open = {}, afgevinkt = {};

const dstr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const VANDAAG = dstr(new Date());
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function b64(t){ const by=new TextEncoder().encode(t); let s=''; by.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); }
function vanB64(c){ return new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,'')), x=>x.charCodeAt(0))); }
function setSync(k,t){ document.getElementById('dot').className='sync-dot '+k;
                       document.getElementById('sync').textContent=t; }

async function haalJson(naam){
  const r = await fetch(API(naam)+'?t='+Date.now(), {headers:H(), cache:'no-store'});
  if (r.status===404) return null;
  if (!r.ok) throw new Error(naam+': '+r.status);
  const j = await r.json();
  return {sha:j.sha, data:JSON.parse(vanB64(j.content))};
}

async function laadAlles(){
  setSync('bezig','laden…');
  try {
    const [k, c, s] = await Promise.all([
      haalJson('catalogus.json'), haalJson('config.json'), haalJson('status.json')
    ]);
    CAT    = k ? k.data : {artikelen:[]};
    CONFIG = c ? c.data : {winkels:{}};
    STATUS = s ? s.data : {};
    sha    = s ? s.sha  : null;
    if (!STATUS.boodschappen) STATUS.boodschappen = {aangevinkt:[], nieuw:[]};
    if (!STATUS.boodschappen.aangevinkt) STATUS.boodschappen.aangevinkt = [];
    if (!STATUS.boodschappen.nieuw)      STATUS.boodschappen.nieuw = [];
    setSync('ok','gesynchroniseerd');
  } catch(e){ setSync('fout','fout bij laden'); console.error(e); }
  teken();
}

async function bewaarStatus(){
  if (bezig){ nogEens = true; return; }
  bezig = true; setSync('bezig','opslaan…');
  try {
    for (let poging=0; poging<4; poging++){
      STATUS.gewijzigd = new Date().toISOString();
      const body = {message:'boodschappen', content:b64(JSON.stringify(STATUS,null,1))};
      if (sha) body.sha = sha;
      const r = await fetch(API('status.json'), {
        method:'PUT', headers:{...H(),'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if (r.ok){
        sha = (await r.json()).content.sha;
        setSync('ok','opgeslagen ✓');
        setTimeout(()=>setSync('ok','gesynchroniseerd'), 2200);
        return;
      }
      if (r.status===409 || r.status===422){
        const vers = await haalJson('status.json');
        if (vers){
          sha = vers.sha;
          for (const k of MIJN) vers.data[k] = STATUS[k];
          STATUS = vers.data;
        }
        continue;
      }
      throw new Error(r.status);
    }
    setSync('fout','opslaan lukt niet');
  } catch(e){ setSync('fout','fout'); console.error(e); }
  finally { bezig=false; if(nogEens){ nogEens=false; bewaarStatus(); } }
}

/* ---------- artikelen: catalogus + wat op de telefoon is bijgemaakt ---------- */
function alleArtikelen(){
  const basis = (CAT && CAT.artikelen) ? CAT.artikelen : [];
  const extra = (STATUS.boodschappen.nieuw || []).map(n=>({
    naam:n.naam, specs:n.specs||'', cat:n.cat||'rest', volgw:9999, volgb:999,
    pref:n.pref||'OKAY', backup:'', opm:'', nieuw:true
  }));
  return basis.concat(extra);
}
const gekozen = () => STATUS.boodschappen.aangevinkt || [];

/* ---------- winkels ---------- */
function winkelInfo(naam){
  const w = (CONFIG.winkels || {})[naam];
  if (!w) return {naam, open:true, tekst:'', volgorde:99};
  if (w.gesloten_tot && VANDAAG < w.gesloten_tot){
    const d = new Date(w.gesloten_tot+'T12:00:00');
    return {naam, open:false, tekst:`gesloten tot ${d.getDate()}/${d.getMonth()+1}`,
            volgorde:w.volgorde||99};
  }
  const uren = (w.open||{})[KORT[new Date().getDay()]];
  if (!uren) return {naam, open:false, tekst:'vandaag gesloten', volgorde:w.volgorde||99};
  return {naam, open:true, tekst:uren, volgorde:w.volgorde||99};
}
/* welke winkel wordt het vandaag: voorkeur, of backup als die dicht is */
function winkelVoor(a){
  const p = winkelInfo(a.pref);
  if (p.open || !a.backup) return {winkel:a.pref, omgeleid:false, let:p.open?'':p.tekst};
  const b = winkelInfo(a.backup);
  if (b.open) return {winkel:a.backup, omgeleid:true,
                      let:`${a.pref} is ${p.tekst} — hier bij ${a.backup}`};
  return {winkel:a.pref, omgeleid:false, let:`${a.pref} en ${a.backup} zijn allebei gesloten`};
}

/* ============================================================ */
function naarTab(t){
  tab = t;
  document.getElementById('tab-a').classList.toggle('aan', t==='aanstip');
  document.getElementById('tab-w').classList.toggle('aan', t==='winkel');
  teken();
}

function teken(){
  if (!CAT){ document.getElementById('inhoud').innerHTML='<div class="leeg">Laden…</div>'; return; }
  const n = gekozen().length;
  const badge = document.getElementById('badge');
  badge.textContent = n; badge.style.display = n ? 'inline-block' : 'none';
  document.getElementById('inhoud').innerHTML = tab==='aanstip' ? tekenAanstip() : tekenWinkel();
}

/* ---------- aanstiplijst ---------- */
function tekenAanstip(){
  const zoek = document.getElementById('zoek').value.trim().toLowerCase();
  const arts = alleArtikelen();
  const sel = gekozen();

  const percat = {};
  for (const a of arts){
    if (zoek && !(a.naam+' '+(a.specs||'')).toLowerCase().includes(zoek)) continue;
    (percat[a.cat] = percat[a.cat] || []).push(a);
  }
  const catnamen = Object.keys(percat).sort((x,y)=>{
    const mx = Math.min(...percat[x].map(a=>a.volgb||999));
    const my = Math.min(...percat[y].map(a=>a.volgb||999));
    return mx-my || x.localeCompare(y);
  });

  let html = '';
  for (const c of catnamen){
    const lijst = percat[c].sort((a,b)=>(a.volgb-b.volgb)||a.naam.localeCompare(b.naam));
    const aantalSel = lijst.filter(a=>sel.includes(a.naam)).length;
    const isOpen = zoek ? true : !!open[c];
    html += `<div class="cat${isOpen?' open':''}">
      <div class="cat-kop" onclick="klapCat('${esc(c)}')">
        <span class="cat-naam">${esc(c)}</span>
        <span style="display:flex;align-items:center;gap:9px;">
          <span class="cat-tel">${aantalSel?`<span class="gekozen">${aantalSel} gekozen</span> · `:''}${lijst.length}</span>
          <span class="pijl">▶</span></span>
      </div>
      <div class="cat-body">${lijst.map(a=>{
        const aan = sel.includes(a.naam);
        return `<div class="art${aan?' aan':''}" onclick="vink('${esc(a.naam).replace(/'/g,"\\'")}')">
          <div class="vk"></div>
          <div class="art-naam">${esc(a.naam)}${a.nieuw?'<span class="merk nw">nieuw</span>':''}
            ${a.pref&&a.pref!=='OKAY'?`<span class="merk">${esc(a.pref)}</span>`:''}
            ${a.specs?`<small>${esc(a.specs)}</small>`:''}</div>
        </div>`;
      }).join('')}</div></div>`;
  }
  if (!catnamen.length) html = '<div class="leeg">Niets gevonden.</div>';

  html += formulier();
  return html;
}

function formulier(){
  const winkels = Object.keys(CONFIG.winkels||{OKAY:1});
  const cats = [...new Set(alleArtikelen().map(a=>a.cat))].sort();
  return `<div class="toevoeg">
    <div class="t-titel">Artikel toevoegen</div>
    <div class="fg">
      <label class="fl">Wat heb je nodig?</label>
      <input class="fi" id="n-naam" type="text" autocomplete="off"
             onkeydown="if(event.key==='Enter')voegToe()">
    </div>
    <div class="fg duo">
      <div><label class="fl">Winkel</label>
        <select class="fi" id="n-winkel">${winkels.map(w=>
          `<option${w==='OKAY'?' selected':''}>${esc(w)}</option>`).join('')}</select></div>
      <div><label class="fl">Soort</label>
        <select class="fi" id="n-cat">
          <option value="rest" selected>— nog te bepalen —</option>
          ${cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>
    </div>
    <button class="bp" onclick="voegToe()">Toevoegen en aanvinken</button>
    <div class="hint">Het artikel komt meteen op de winkellijst. De juiste plek in de
      schaprij wordt later op de pc gezet.</div>
  </div>`;
}

/* ---------- winkellijst ---------- */
function tekenWinkel(){
  const sel = gekozen();
  if (!sel.length) return '<div class="leeg">Nog niets aangevinkt.</div>';

  const arts = alleArtikelen();
  const perwinkel = {};
  for (const naam of sel){
    const a = arts.find(x=>x.naam===naam) ||
              {naam, specs:'', cat:'rest', volgw:9999, pref:'OKAY', backup:''};
    const w = winkelVoor(a);
    (perwinkel[w.winkel] = perwinkel[w.winkel] || []).push({a, let:w.let});
  }

  const namen = Object.keys(perwinkel).sort(
    (x,y)=>winkelInfo(x).volgorde - winkelInfo(y).volgorde);

  let html = '';
  for (const wn of namen){
    const info = winkelInfo(wn);
    const lijst = perwinkel[wn].sort((p,q)=>(p.a.volgw-q.a.volgw)||p.a.naam.localeCompare(q.a.naam));
    const nogTeDoen = lijst.filter(p=>!afgevinkt[p.a.naam]).length;
    html += `<div class="winkel">
      <div class="w-kop">
        <span class="w-naam">${esc(wn)}</span>
        <span class="w-uren${info.open?'':' dicht'}">${esc(info.tekst)}</span>
        <span class="w-tel">${nogTeDoen} van ${lijst.length}</span>
      </div>
      <div class="w-lijst">${lijst.map(p=>{
        const af = !!afgevinkt[p.a.naam];
        return `<div class="w-art${af?' af':''}" onclick="afvink('${esc(p.a.naam).replace(/'/g,"\\'")}')">
          <div class="vk" style="${af?'background:#4a7c59;border-color:#4a7c59':''}">${af?'':''}</div>
          <div class="w-naam2">${esc(p.a.naam)}
            ${p.a.specs?`<small>${esc(p.a.specs)}</small>`:''}
            ${p.let?`<span class="w-let">${esc(p.let)}</span>`:''}</div>
        </div>`;
      }).join('')}</div></div>`;
  }
  html += `<button class="wisknop" onclick="wisAlles()">Lijst leegmaken</button>`;
  return html;
}

/* ---------- acties ---------- */
function klapCat(c){ open[c] = !open[c]; teken(); }

function vink(naam){
  const s = STATUS.boodschappen.aangevinkt;
  const i = s.indexOf(naam);
  if (i>=0) s.splice(i,1); else s.push(naam);
  teken(); bewaarStatus();
}
function afvink(naam){
  afgevinkt[naam] = !afgevinkt[naam];
  teken();                      /* enkel lokaal tijdens het winkelen */
}
function voegToe(){
  const el = document.getElementById('n-naam');
  const naam = el.value.trim();
  if (!naam){ el.focus(); return; }
  const bestaat = alleArtikelen().find(a=>a.naam.toLowerCase()===naam.toLowerCase());
  if (bestaat){
    if (!gekozen().includes(bestaat.naam)) STATUS.boodschappen.aangevinkt.push(bestaat.naam);
  } else {
    STATUS.boodschappen.nieuw.push({
      naam,
      cat: document.getElementById('n-cat').value,
      pref: document.getElementById('n-winkel').value,
      specs:'', toegevoegd: VANDAAG
    });
    STATUS.boodschappen.aangevinkt.push(naam);
  }
  el.value='';
  teken(); bewaarStatus();
  setTimeout(()=>{ const n=document.getElementById('n-naam'); if(n) n.focus(); }, 60);
}
function wisAlles(){
  if (!confirm('De hele lijst leegmaken?')) return;
  STATUS.boodschappen.aangevinkt = [];
  afgevinkt = {};
  teken(); bewaarStatus();
}

laadAlles();
</script>
</body>
</html>
