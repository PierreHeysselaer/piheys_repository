<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Concierge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{max-width:100%;overflow-x:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f7f5;color:#111;padding-bottom:100px;}
#header{background:#fff;border-bottom:1px solid #e5e3de;padding:10px 12px 0;position:sticky;top:0;z-index:20;}
#search-wrap{margin-bottom:8px;}
#search{width:100%;font-size:15px;padding:7px 10px;border:1px solid #ddd;border-radius:8px;background:#fafaf8;}
#tabbar{display:flex;}
.tab{flex:1;text-align:center;padding:9px 0;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-size:13px;color:#888;font-weight:400;}
.tab.active{color:#4a7c59;border-bottom-color:#4a7c59;font-weight:600;}
#badge{display:inline-block;background:#4a7c59;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:4px;vertical-align:middle;}
/* Sync */
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ccc;margin-right:3px;vertical-align:middle;transition:background .3s;}
.sync-dot.ok{background:#4a7c59;}
.sync-dot.bezig{background:#e6a817;animation:sdpulse 1s infinite;}
.sync-dot.fout{background:#c0392b;}
@keyframes sdpulse{0%,100%{opacity:1}50%{opacity:.3}}
/* Aanstiplijst */
#app-wrap{padding:8px 10px 0;}
.cat-block{margin-bottom:4px;border:1px solid #e8e6e1;border-radius:8px;overflow:hidden;background:#fff;}
.cat-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;cursor:pointer;background:#f2f1ec;user-select:none;}
.cat-head span.label{font-size:13px;font-weight:500;text-transform:capitalize;}
.cat-head .arr{font-size:11px;color:#bbb;transition:transform .15s;}
.cat-head.open .arr{transform:rotate(90deg);}
.cat-items{display:none;}
.cat-items.open{display:block;}
.item-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #f0ede8;}
.item-row input{width:20px;height:20px;cursor:pointer;accent-color:#4a7c59;flex-shrink:0;}
.item-row .name{flex:1;font-size:14px;line-height:1.3;word-break:break-word;}
.item-row .specs{font-size:12px;color:#aaa;display:block;}
.item-row.checked .name{color:#bbb;text-decoration:line-through;}
.item-extra-badge{font-size:10px;background:#eaf4ee;color:#4a7c59;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:middle;}
/* Winkellijst */
.store-block{margin-bottom:16px;}
.store-hd{display:flex;align-items:center;justify-content:space-between;background:#eae8e2;border-radius:8px;padding:10px 12px;margin-bottom:2px;}
.store-hd .sname{font-size:16px;font-weight:500;}
.store-hd .scnt{font-size:12px;color:#888;}
.store-hd.closed{opacity:.55;}
.wclosed{font-size:11px;color:#c47f00;font-weight:400;margin-left:6px;}
.wrow{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f0ede8;background:#fff;}
.wrow:first-child{border-top:1px solid #f0ede8;}
.wrow input{width:20px;height:20px;cursor:pointer;accent-color:#4a7c59;flex-shrink:0;}
.wrow.dimmed{opacity:.35;}
.wrow.wdone .wname{text-decoration:line-through;color:#bbb;}
.wname{flex:1;font-size:14px;word-break:break-word;}
.wspecs{font-size:12px;color:#aaa;}
.wnote{font-size:11px;color:#c47f00;margin-left:4px;}
.wcheck{color:#4a7c59;font-size:15px;}
/* Acties */
#actions{padding:0 10px;margin-top:8px;}
.confirm-btn{width:100%;font-size:15px;padding:13px;border:1px solid #ddd;border-radius:9px;cursor:pointer;background:#fff;color:#111;}
#empty-winkel{text-align:center;padding:40px 0;color:#bbb;font-size:15px;}
/* Nieuw artikel */
#nieuw-artikel-wrap{padding:10px 10px 0;}
.toevoeg-toggle{width:100%;padding:11px;background:none;border:2px dashed #d5d3ce;border-radius:8px;font-size:14px;color:#aaa;cursor:pointer;text-align:center;}
.toevoeg-toggle:active{border-color:#4a7c59;color:#4a7c59;}
#nieuw-artikel-form{background:#fff;border:1px solid #e8e6e1;border-radius:8px;padding:14px;margin-top:6px;}
.fg{margin-bottom:10px;}
.fl{display:block;font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
.fi{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:7px;font-size:14px;color:#111;background:#fafaf8;outline:none;}
.fi:focus{border-color:#4a7c59;}
.fi-row{display:flex;gap:8px;}
.fi-row .fi{flex:1;}
.btn-add{width:100%;padding:11px;background:#4a7c59;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
/* Taken tab */
#taken-wrap{padding:8px 10px 0;}
.sectie-titel{font-size:11px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 6px;}
.taak-item{display:flex;align-items:flex-start;gap:12px;border:1px solid #e8e6e1;border-radius:10px;padding:11px 13px;margin-bottom:6px;background:#fff;}
.taak-item.relevant{border-color:#b8dfc5;background:#eaf4ee;}
.taak-item.gedaan{opacity:.4;}
.taak-item.gedaan .taak-naam{text-decoration:line-through;}
.taak-check{width:24px;height:24px;flex-shrink:0;margin-top:1px;border:2px solid #ddd;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;}
.taak-item.relevant .taak-check{border-color:#b8dfc5;}
.taak-check.actief{background:#4a7c59;border-color:#4a7c59;}
.taak-check.actief::after{content:'✓';color:#fff;font-size:13px;font-weight:700;}
.taak-info{flex:1;min-width:0;}
.taak-naam{font-size:14px;font-weight:500;line-height:1.3;}
.taak-meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px;}
.tbadge{font-size:10px;padding:2px 7px;border-radius:10px;font-weight:600;}
.tbadge-h{background:#e8f0fe;color:#1a73e8;}
.tbadge-e{background:#fef3e8;color:#d97706;}
.tbadge-v{background:#eaf4ee;color:#4a7c59;border:1px solid #b8dfc5;}
.taak-when{font-size:11px;color:#aaa;}
.taak-delete{flex-shrink:0;color:#bbb;cursor:pointer;font-size:20px;line-height:1;padding:2px 4px;border-radius:5px;}
.taak-delete:active{color:#c0392b;background:#fdecea;}
.nieuw-taak-btn{width:100%;padding:11px;background:none;border:2px dashed #d5d3ce;border-radius:8px;font-size:14px;color:#aaa;cursor:pointer;text-align:center;margin-top:6px;}
.nieuw-taak-btn:active{border-color:#4a7c59;color:#4a7c59;}
.taken-leeg{text-align:center;color:#bbb;font-size:14px;padding:24px 0;font-style:italic;}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:22px 18px 44px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;}
.modal-titel{font-size:17px;font-weight:600;margin-bottom:16px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{padding:7px 14px;border-radius:20px;border:1px solid #ddd;background:#f7f7f5;font-size:13px;cursor:pointer;user-select:none;}
.chip.actief{background:#4a7c59;color:#fff;border-color:#4a7c59;}
.temp-fg{display:flex;align-items:center;gap:8px;}
.temp-fg .fi{width:90px;flex:none;}
.modal-knoppen{display:flex;gap:8px;margin-top:20px;}
.btn-p{flex:1;padding:13px;background:#4a7c59;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
.btn-s{flex:1;padding:13px;background:#f2f1ec;color:#888;border:1px solid #e5e3de;border-radius:10px;font-size:15px;cursor:pointer;}
</style>
</head>
<body>

<div id="header">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:16px;font-weight:500;">Concierge</span>
      <div>
        <span class="sync-dot" id="sync-dot"></span>
        <span id="sync-tekst" style="font-size:11px;color:#aaa;">–</span>
      </div>
    </div>
    <div style="display:flex;gap:5px;align-items:center;">
      <button onclick="laadData()" style="font-size:12px;padding:4px 9px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#888;cursor:pointer;" title="Herlaad">↻</button>
      <button onclick="slaOp()" style="font-size:12px;padding:4px 9px;border:1px solid #4a7c59;border-radius:6px;background:#4a7c59;color:#fff;cursor:pointer;" title="Opslaan">💾</button>
      <button onclick="resetLijst()" style="font-size:12px;padding:4px 9px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#bbb;cursor:pointer;">Wis</button>
    </div>
  </div>
  <div id="search-wrap" style="margin-bottom:8px;"><input id="search" type="search" placeholder="zoeken in boodschappen…" oninput="filterItems(this.value)"></div>
  <div id="tabbar">
    <button class="tab active" onclick="setTab('aanstip')">Aanstiplijst</button>
    <button class="tab" onclick="setTab('winkel')">Winkellijst <span id="badge">0</span></button>
    <button class="tab" onclick="setTab('taken')">✓ Taken</button>
  </div>
</div>

<!-- Aanstip + Winkel content -->
<div id="app-wrap"></div>
<div id="actions"></div>

<!-- Nieuw artikel (onderaan aanstip) -->
<div id="nieuw-artikel-wrap" style="display:none;">
  <button class="toevoeg-toggle" onclick="toggleArtikelForm()">+ Nieuw artikel toevoegen</button>
  <div id="nieuw-artikel-form" style="display:none;">
    <div class="fg">
      <label class="fl">Naam</label>
      <input class="fi" id="na-naam" type="text" placeholder="Naam van het artikel" autocomplete="off">
    </div>
    <div class="fg">
      <label class="fl">Specs (optioneel)</label>
      <input class="fi" id="na-specs" type="text" placeholder="bijv. gezouten, 1 kg…" autocomplete="off">
    </div>
    <div class="fi-row">
      <div class="fg" style="flex:1;">
        <label class="fl">Categorie</label>
        <select class="fi" id="na-cat">
          <option value="snack">snack</option>
          <option value="maaltijd">maaltijd</option>
          <option value="keuken" selected>keuken</option>
          <option value="groenten">groenten</option>
          <option value="vlees">vlees</option>
          <option value="vis">vis</option>
          <option value="beleg">beleg</option>
          <option value="brood">brood</option>
          <option value="ontbijt">ontbijt</option>
          <option value="fruit">fruit</option>
          <option value="kruiden">kruiden</option>
          <option value="drank">drank</option>
          <option value="melk">melk</option>
          <option value="sausen ed">sausen ed</option>
          <option value="persoonlijk">persoonlijk</option>
          <option value="vaatwas">vaatwas</option>
          <option value="was">was</option>
          <option value="dier">dier</option>
          <option value="logistiek">logistiek</option>
          <option value="onderhoud">onderhoud</option>
          <option value="batterijen">batterijen</option>
          <option value="rest">rest</option>
          <option value="special">special</option>
          <option value="leeggoed">leeggoed</option>
        </select>
      </div>
      <div class="fg" style="flex:1;">
        <label class="fl">Winkel</label>
        <select class="fi" id="na-pref">
          <option value="OKAY" selected>OKAY</option>
          <option value="SPAR">SPAR</option>
          <option value="Bakker">Bakker</option>
        </select>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Backup winkel (optioneel)</label>
      <select class="fi" id="na-backup">
        <option value="">geen</option>
        <option value="OKAY">OKAY</option>
        <option value="SPAR" selected>SPAR</option>
      </select>
    </div>
    <button class="btn-add" onclick="voegArtikelToe()">Toevoegen aan lijst</button>
  </div>
</div>

<!-- Taken sectie -->
<div id="taken-wrap" style="display:none;">
  <div id="taken-lijst"></div>
  <button class="nieuw-taak-btn" onclick="openTaakModal()">+ Nieuwe taak</button>
</div>

<!-- Modal nieuwe taak -->
<div class="modal-overlay" id="taak-modal" onclick="sluitTaakModalBuiten(event)">
  <div class="modal">
    <div class="modal-titel">Nieuwe taak</div>
    <div class="fg">
      <label class="fl">Naam</label>
      <input class="fi" id="tf-naam" type="text" placeholder="Wat moet er gedaan worden?" autocomplete="off"
        onkeydown="if(event.key==='Enter') voegTaakToe()">
    </div>
    <div class="fg">
      <label class="fl">Type</label>
      <div class="chips">
        <div class="chip actief" data-g="type" data-v="eenmalig" onclick="kiesChip(this)">Éénmalig</div>
        <div class="chip" data-g="type" data-v="herhalend" onclick="kiesChip(this)">Herhalend</div>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Weer (optioneel)</label>
      <div class="chips" id="tcg-weer">
        <div class="chip" data-v="droog" onclick="toggleChip(this)">☀️ Droog</div>
        <div class="chip" data-v="bewolkt" onclick="toggleChip(this)">☁️ Bewolkt</div>
        <div class="chip" data-v="regen" onclick="toggleChip(this)">🌧️ Regen</div>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Temperatuur (optioneel)</label>
      <div class="temp-fg">
        <input class="fi" id="tf-tmin" type="number" placeholder="Min °C">
        <span style="color:#aaa;font-size:13px;">tot</span>
        <input class="fi" id="tf-tmax" type="number" placeholder="Max °C">
        <span style="color:#aaa;font-size:13px;">°C</span>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Seizoen (optioneel)</label>
      <div class="chips" id="tcg-seizoen">
        <div class="chip" data-v="lente" onclick="toggleChip(this)">🌱 Lente</div>
        <div class="chip" data-v="zomer" onclick="toggleChip(this)">☀️ Zomer</div>
        <div class="chip" data-v="herfst" onclick="toggleChip(this)">🍂 Herfst</div>
        <div class="chip" data-v="winter" onclick="toggleChip(this)">❄️ Winter</div>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Dag van de week (optioneel)</label>
      <div class="chips" id="tcg-dag">
        <div class="chip" data-v="ma" onclick="toggleChip(this)">Ma</div>
        <div class="chip" data-v="di" onclick="toggleChip(this)">Di</div>
        <div class="chip" data-v="wo" onclick="toggleChip(this)">Wo</div>
        <div class="chip" data-v="do" onclick="toggleChip(this)">Do</div>
        <div class="chip" data-v="vr" onclick="toggleChip(this)">Vr</div>
        <div class="chip" data-v="za" onclick="toggleChip(this)">Za</div>
        <div class="chip" data-v="zo" onclick="toggleChip(this)">Zo</div>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Feestdag (optioneel)</label>
      <div class="chips">
        <div class="chip actief" data-g="feestdag" data-v="null" onclick="kiesChip(this)">Maakt niet uit</div>
        <div class="chip" data-g="feestdag" data-v="true" onclick="kiesChip(this)">Alleen feestdag</div>
        <div class="chip" data-g="feestdag" data-v="false" onclick="kiesChip(this)">Geen feestdag</div>
      </div>
    </div>
    <div class="modal-knoppen">
      <button class="btn-s" onclick="sluitTaakModal()">Annuleren</button>
      <button class="btn-p" onclick="voegTaakToe()">Toevoegen</button>
    </div>
  </div>
</div>

  } else { ac.innerHTML = ''; }
}

// ===== AANSTIPLIJST =====
function renderAanstip() {
  const ap = document.getElementById('app-wrap');
  const items = getMergedItems();
  let cats = CAT_ORDER;
  if (searchQ) {
    const matched = new Set(items.filter(i => i.naam.toLowerCase().includes(searchQ)||i.specs.toLowerCase().includes(searchQ)).map(i=>i.cat));
    cats = CAT_ORDER.filter(c => matched.has(c));
  }
  if (!cats.length) { ap.innerHTML='<p style="text-align:center;padding:40px;color:#bbb;">Geen resultaten</p>'; return; }
  ap.innerHTML = cats.map(cat => {
    let catItems = items.filter(i => i.cat === cat);
    if (searchQ) catItems = catItems.filter(i => i.naam.toLowerCase().includes(searchQ)||i.specs.toLowerCase().includes(searchQ));
    if (!catItems.length) return '';
    const selInCat = catItems.filter(i => selected.has(i.naam)).length;
    return `<div class="cat-block">
      <div class="cat-head${searchQ?' open':''}" onclick="toggleCat(this)">
        <span class="label">${cat}</span>
        <span style="display:flex;align-items:center;gap:8px;">
          ${selInCat>0?`<span style="font-size:11px;color:#4a7c59;font-weight:500;">${selInCat} gekozen</span>`:''}
          <span style="font-size:11px;color:#aaa;">${catItems.length}</span>
          <span class="arr">▶</span>
        </span>
      </div>
      <div class="cat-items${searchQ?' open':''}">
        ${catItems.map(it=>`
          <div class="item-row${selected.has(it.naam)?' checked':''}">
            <input type="checkbox" id="cb_${it.naam.replace(/"/g,'')}" ${selected.has(it.naam)?'checked':''} onchange="toggleSelect('${it.naam.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">
            <span class="name">${it.naam}${it.specs?`<span class="specs">${it.specs}</span>`:''}${isExtraArtikel(it.naam)?'<span class="item-extra-badge">nieuw</span>':''}</span>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleCat(head) { head.classList.toggle('open'); head.nextElementSibling.classList.toggle('open'); }

// ===== WINKELLIJST =====
function renderWinkel() {
  const ap = document.getElementById('app-wrap');
  const items = getMergedItems();
  if (selected.size === 0) { ap.innerHTML='<div id="empty-winkel">Nog niets aangevinkt.<br>Ga naar de aanstiplijst.</div>'; renderActions(); return; }
  const byStore = {}; STORE_ORDER.forEach(s => byStore[s] = []);
  items.filter(i => selected.has(i.naam)).forEach(it => {
    const open = storeOpen(it.pref);
    if (open) {
      (byStore[it.pref] = byStore[it.pref]||[]).push({...it,_note:null,_fb:false});
      if (it.backup) (byStore[it.backup]=byStore[it.backup]||[]).push({...it,_note:`al bij ${it.pref} gekocht?`,_fb:true});
    } else {
      const fb = it.backup||'OKAY';
      (byStore[fb]=byStore[fb]||[]).push({...it,_note:`${it.pref} ${closedLabel(it.pref)}`,_fb:false});
    }
  });
  const activeStores = STORE_ORDER.filter(s => byStore[s]&&byStore[s].length);
  ap.innerHTML = activeStores.map(store => {
    const si = byStore[store];
    const main = si.filter(i=>!i._fb).sort((a,b)=>a.volgw-b.volgw);
    const fb   = si.filter(i=>i._fb).sort((a,b)=>a.volgw-b.volgw);
    const done = main.filter(i=>winkDone.has(i.naam));
    const todo = main.filter(i=>!winkDone.has(i.naam));
    const open = storeOpen(store);
    return `<div class="store-block">
      <div class="store-hd${open?'':' closed'}">
        <span class="sname">🛒 ${store}${!open?`<span class="wclosed">${closedLabel(store)}</span>`:''}</span>
        <span class="scnt">${done.length}/${main.length}</span>
      </div>
      ${[...todo,...done,...fb].map(it=>`
        <div class="wrow${it._fb?' dimmed':''}${winkDone.has(it.naam)?' wdone':''}">
          <input type="checkbox" ${winkDone.has(it.naam)?'checked':''} ${it._fb?'disabled':''} onchange="toggleWinkDone('${it.naam.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">
          <span class="wname">${it.naam}${it.specs?`<span class="wspecs"> — ${it.specs}</span>`:''}${it._note?`<span class="wnote">(${it._note})</span>`:''}</span>
          ${winkDone.has(it.naam)?'<span class="wcheck">✓</span>':''}
        </div>`).join('')}
    </div>`;
  }).join('');
  renderActions();
}

// ===== NIEUW ARTIKEL =====
function toggleArtikelForm() {
  const f = document.getElementById('nieuw-artikel-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
  if (f.style.display === 'block') setTimeout(() => document.getElementById('na-naam').focus(), 100);
}

function voegArtikelToe() {
  const naam = document.getElementById('na-naam').value.trim();
  if (!naam) { document.getElementById('na-naam').focus(); return; }
  // Dubbel check
  const bestaand = getMergedItems().find(i => i.naam.toLowerCase() === naam.toLowerCase());
  if (bestaand) { alert(`"${naam}" staat al in de lijst (categorie: ${bestaand.cat}).`); return; }
  const specs  = document.getElementById('na-specs').value.trim();
  const cat    = document.getElementById('na-cat').value;
  const pref   = document.getElementById('na-pref').value;
  const backup = document.getElementById('na-backup').value;
  // Bereken volgorde: einde van categorie
  const catItems = getMergedItems().filter(i => i.cat === cat);
  const volgw = catItems.length ? Math.max(...catItems.map(i => i.volgw)) + 10 : 5000;
  const volgb = catItems.length ? catItems[0].volgb : 50;
  const nieuw = { naam, specs, volgw, volgb, cat, pref, backup, opm: '' };
  if (!syncData.artikelen_extra) syncData.artikelen_extra = [];
  syncData.artikelen_extra.push(nieuw);
  // Meteen aanvinken
  selected.add(naam);
  // Reset form
  document.getElementById('na-naam').value = '';
  document.getElementById('na-specs').value = '';
  document.getElementById('nieuw-artikel-form').style.display = 'none';
  slaOp();
  renderAanstip();
  renderBadge();
}

// ===== TAKEN TAB =====
// Belgische feestdagen
const FEESTDAGEN = new Set(['2026-01-01','2026-04-06','2026-05-01','2026-05-14','2026-05-25','2026-07-21','2026-08-15','2026-11-01','2026-11-11','2026-12-25','2027-01-01','2027-03-29','2027-05-01','2027-05-06','2027-05-17','2027-07-21','2027-08-15','2027-11-01','2027-11-11','2027-12-25']);
const KORT_DAG = ['zo','ma','di','wo','do','vr','za'];

function datumStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function isFeestdag(d) { return FEESTDAGEN.has(datumStr(d)); }
function getSeizoeen(d) { const m=d.getMonth()+1; return m<=2||m===12?'winter':m<=5?'lente':m<=8?'zomer':'herfst'; }

function heeftVoorwaarden(t) {
  const v = t.voorwaarden||{};
  return (v.dag&&v.dag.length)||(v.seizoen&&v.seizoen.length)||(v.weer&&v.weer.length)||v.feestdag!=null||v.temp_min!=null||v.temp_max!=null;
}
function taakRelevantVandaag(t) {
  const v = t.voorwaarden||{};
  if (v.dag&&v.dag.length&&!v.dag.includes(KORT_DAG[TODAY.getDay()])) return false;
  if (v.seizoen&&v.seizoen.length&&!v.seizoen.includes(getSeizoeen(TODAY))) return false;
  if (v.feestdag===true&&!isFeestdag(TODAY)) return false;
  if (v.feestdag===false&&isFeestdag(TODAY)) return false;
  if (weerInfo&&v.weer&&v.weer.length&&!v.weer.includes(weerInfo.weerType)) return false;
  if (weerInfo&&v.temp_min!=null&&weerInfo.temp<v.temp_min) return false;
  if (weerInfo&&v.temp_max!=null&&weerInfo.temp>v.temp_max) return false;
  return true;
}

function formatLaatste(log) {
  if (!log||!log.length) return 'nooit gedaan';
  const d = new Date(log[log.length-1]+'T12:00:00');
  const diff = Math.floor((TODAY-d)/86400000);
  if (diff===0) return 'vandaag gedaan';
  if (diff===1) return 'gisteren gedaan';
  if (diff<7) return `${diff} dagen geleden`;
  if (diff<14) return '1 week geleden';
  if (diff<60) return `${Math.floor(diff/7)} weken geleden`;
  return `meer dan ${Math.floor(diff/30)} maanden geleden`;
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderTaken() {
  const el = document.getElementById('taken-lijst');
  const taken = syncData.taken||[];
  if (!taken.length) { el.innerHTML='<div class="taken-leeg">Geen taken. Klik hieronder om er een toe te voegen.</div>'; return; }
  const actief = taken.filter(t => !(t.type==='eenmalig'&&t.gedaan));
  const gedaan = taken.filter(t => t.type==='eenmalig'&&t.gedaan);
  const vandaag = actief.filter(t => !heeftVoorwaarden(t)||taakRelevantVandaag(t));
  const andere  = actief.filter(t => heeftVoorwaarden(t)&&!taakRelevantVandaag(t));
  let html = '';
  if (vandaag.length) {
    if (andere.length||gedaan.length) html += '<div class="sectie-titel">Vandaag</div>';
    html += vandaag.map(t => taakHTML(t, true)).join('');
  }
  if (andere.length) { html += '<div class="sectie-titel" style="margin-top:14px;">Andere taken</div>'; html += andere.map(t=>taakHTML(t,false)).join(''); }
  if (gedaan.length) { html += '<div class="sectie-titel" style="margin-top:14px;opacity:.5;">Afgewerkt</div>'; html += gedaan.map(t=>taakHTML(t,false)).join(''); }
  el.innerHTML = html;
}

function taakHTML(t, relevant) {
  const isH = t.type==='herhalend', isG = t.type==='eenmalig'&&t.gedaan;
  const vandaagGedaan = isH && t.log && t.log[t.log.length-1] === datumStr(TODAY);
  let badges = isH ? `<span class="tbadge tbadge-h">Herhalend</span>` : `<span class="tbadge tbadge-e">Éénmalig</span>`;
  if (relevant&&heeftVoorwaarden(t)) badges += `<span class="tbadge tbadge-v">✓ vandaag</span>`;
  const meta = isH ? `<span class="taak-when">${formatLaatste(t.log)}</span>` : '';
  const checkActief = isG || vandaagGedaan;
  return `<div class="taak-item${relevant?' relevant':''}${isG?' gedaan':''}">
    <div class="taak-check${checkActief?' actief':''}" onclick="toggleTaak('${escHtml(t.id)}')"></div>
    <div class="taak-info">
      <div class="taak-naam">${escHtml(t.naam)}</div>
      <div class="taak-meta">${badges}${meta}</div>
    </div>
    <div class="taak-delete" onclick="verwijderTaak('${escHtml(t.id)}')">×</div>
  </div>`;
}

function toggleTaak(id) {
  const t = (syncData.taken||[]).find(x=>x.id===id);
  if (!t) return;
  if (t.type==='herhalend') {
    if (!t.log) t.log=[];
    const v = datumStr(TODAY);
    if (t.log[t.log.length-1]===v) t.log.pop(); else t.log.push(v);
  } else { t.gedaan=!t.gedaan; }
  renderTaken(); slaOp();
}

function verwijderTaak(id) {
  if (!confirm('Taak verwijderen?')) return;
  syncData.taken=(syncData.taken||[]).filter(x=>x.id!==id);
  renderTaken(); slaOp();
}

// ===== TAAK MODAL =====
function openTaakModal() {
  document.getElementById('tf-naam').value='';
  document.querySelectorAll('[data-g="type"]').forEach(el=>el.classList.toggle('actief',el.dataset.v==='eenmalig'));
  document.querySelectorAll('[data-g="feestdag"]').forEach(el=>el.classList.toggle('actief',el.dataset.v==='null'));
  document.querySelectorAll('#tcg-weer .chip,#tcg-seizoen .chip,#tcg-dag .chip').forEach(el=>el.classList.remove('actief'));
  document.getElementById('tf-tmin').value='';
  document.getElementById('tf-tmax').value='';
  document.getElementById('taak-modal').classList.add('open');
  setTimeout(()=>document.getElementById('tf-naam').focus(),150);
}
function sluitTaakModal() { document.getElementById('taak-modal').classList.remove('open'); }
function sluitTaakModalBuiten(e) { if(e.target===document.getElementById('taak-modal')) sluitTaakModal(); }
function kiesChip(el) {
  const g=el.dataset.g;
  document.querySelectorAll(`[data-g="${g}"]`).forEach(e=>e.classList.remove('actief'));
  el.classList.add('actief');
}
function toggleChip(el) { el.classList.toggle('actief'); }
function getChipWaarde(g) { const a=document.querySelector(`[data-g="${g}"].actief`); return a?a.dataset.v:null; }
function getCheckWaarden(id) { return [...document.querySelectorAll(`#${id} .chip.actief`)].map(el=>el.dataset.v); }

function voegTaakToe() {
  const naam=document.getElementById('tf-naam').value.trim();
  if (!naam) { document.getElementById('tf-naam').focus(); return; }
  const type=getChipWaarde('type')||'eenmalig';
  const fdV=getChipWaarde('feestdag');
  const feestdag=fdV==='true'?true:fdV==='false'?false:null;
  const tmin=document.getElementById('tf-tmin').value;
  const tmax=document.getElementById('tf-tmax').value;
  const v={};
  const wArr=getCheckWaarden('tcg-weer'); if(wArr.length) v.weer=wArr;
  if(tmin!=='') v.temp_min=parseInt(tmin);
  if(tmax!=='') v.temp_max=parseInt(tmax);
  const sArr=getCheckWaarden('tcg-seizoen'); if(sArr.length) v.seizoen=sArr;
  const dArr=getCheckWaarden('tcg-dag'); if(dArr.length) v.dag=dArr;
  if(feestdag!==null) v.feestdag=feestdag;
  const taak={id:'t_'+Date.now(),naam,type,voorwaarden:v,...(type==='herhalend'?{log:[]}:{gedaan:false})};
  if(!syncData.taken) syncData.taken=[];
  syncData.taken.push(taak);
  sluitTaakModal(); renderTaken(); slaOp();
}

// ===== INIT =====
function render() {
  renderBadge();
  if (currentTab==='aanstip') renderAanstip();
  else if (currentTab==='winkel') renderWinkel();
  else renderTaken();
  renderActions();
}
