<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Medicatie Bea</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{max-width:100%;overflow-x:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f7f5;color:#111;
     padding-bottom:100px;font-size:16px;max-width:1000px;margin:0 auto;}
#header{background:#fff;border-bottom:1px solid #e5e3de;padding:12px;position:sticky;top:0;z-index:20;
        display:flex;align-items:center;justify-content:space-between;}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ccc;margin-right:4px;
          vertical-align:middle;transition:background .3s;}
.sync-dot.ok{background:#4a7c59;} .sync-dot.bezig{background:#e6a817;animation:p 1s infinite;}
.sync-dot.fout{background:#c0392b;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
#wrap{padding:12px;}

.alarm{border-radius:11px;padding:14px 16px;margin-bottom:12px;font-size:15px;line-height:1.45;}
.alarm.rood{background:#fdecea;border:1px solid #f3c4bd;color:#a3271a;}
.alarm.oranje{background:#fff8e8;border:1px solid #f0dcb0;color:#8a6414;}
.alarm b{font-weight:650;}
.alarm ul{margin:7px 0 0 18px;} .alarm li{margin:3px 0;}

.med{background:#fff;border:1px solid #e8e6e1;border-radius:12px;padding:15px;margin-bottom:10px;}
.med.krap{border-color:#f3c4bd;}
.med-kop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:3px;}
.med-naam{font-size:17px;font-weight:600;line-height:1.25;}
.med-sub{font-size:13.5px;color:#999;margin-bottom:12px;}
.tot{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:9px;white-space:nowrap;}
.tot.groen{background:#eaf4ee;color:#3d6b4a;} .tot.oranje{background:#fff5e0;color:#96700f;}
.tot.rood{background:#fdecea;color:#a3271a;}

.rij{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;
     border-top:1px solid #f2f1ec;}
.rij-label{font-size:14.5px;color:#555;flex:1;min-width:0;}
.rij-label small{display:block;color:#aaa;font-size:12.5px;margin-top:1px;}
.rij-waarde{font-size:16px;font-weight:600;min-width:52px;text-align:right;}
.rij-waarde.tikbaar{cursor:pointer;border-bottom:1px dashed #c8c6c1;padding-bottom:1px;}
.rij-waarde.tikbaar:active{color:#4a7c59;border-bottom-color:#4a7c59;}
.knopjes{display:flex;gap:5px;align-items:center;}
.kn{width:34px;height:34px;border:1px solid #ddd;border-radius:8px;background:#fafaf8;font-size:17px;
    color:#555;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kn:active{background:#eaf4ee;border-color:#4a7c59;color:#4a7c59;}
.kn.breed{width:auto;padding:0 11px;font-size:13.5px;font-weight:600;}

.doosje{background:#f9f9f7;border-radius:9px;padding:11px 13px;margin-top:11px;}
.doosje-rij{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.doosje-tekst{font-size:14px;color:#555;line-height:1.4;}
.doosje-tekst b{color:#111;}
.waarschuw{font-size:13.5px;color:#a3271a;margin-top:7px;line-height:1.4;}
.vul-knop{padding:9px 14px;background:#4a7c59;color:#fff;border:none;border-radius:8px;font-size:14px;
          font-weight:600;cursor:pointer;white-space:nowrap;}
.vul-knop.uit{background:#e8e6e1;color:#999;}

.acties{display:flex;gap:7px;margin-top:12px;}
.mini{flex:1;padding:8px;background:#f7f7f5;border:1px solid #e5e3de;border-radius:8px;font-size:13.5px;
      color:#888;cursor:pointer;}
.mini:active{color:#4a7c59;border-color:#b8dfc5;}
.leeg{text-align:center;color:#c0c0c0;font-size:15px;padding:40px 0;font-style:italic;}
.knop-nieuw{width:100%;padding:13px;background:none;border:2px dashed #d5d3ce;border-radius:9px;
            font-size:15px;color:#a5a5a5;cursor:pointer;margin-top:8px;}
.knop-nieuw:active{border-color:#4a7c59;color:#4a7c59;}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
         align-items:flex-end;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:22px 18px 44px;width:100%;max-width:640px;
       max-height:92vh;overflow-y:auto;}
.m-titel{font-size:18px;font-weight:600;margin-bottom:16px;}
.fg{margin-bottom:13px;}
.fl{display:block;font-size:11.5px;font-weight:600;color:#888;text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:6px;}
.fi{width:100%;padding:11px 13px;border:1px solid #ddd;border-radius:8px;font-size:16px;
    background:#fafaf8;outline:none;}
.fi:focus{border-color:#4a7c59;}
.duo{display:flex;gap:9px;} .duo>div{flex:1;}
.hint{font-size:12.5px;color:#aaa;margin-top:5px;line-height:1.35;}
.knoppen{display:flex;gap:9px;margin-top:20px;}
.bp{flex:1;padding:14px;background:#4a7c59;color:#fff;border:none;border-radius:10px;font-size:16px;
    font-weight:600;cursor:pointer;}
.bs{flex:1;padding:14px;background:#f2f1ec;color:#888;border:1px solid #e5e3de;border-radius:10px;
    font-size:16px;cursor:pointer;}
</style>
</head>
<body>

<div id="header">
  <div style="display:flex;align-items:center;gap:9px;">
    <span style="font-size:17px;font-weight:500;">Medicatie Bea</span>
    <span><span class="sync-dot" id="dot"></span><span id="sync" style="font-size:12px;color:#aaa;">–</span></span>
  </div>
  <button onclick="laadAlles()" style="font-size:14px;padding:6px 11px;border:1px solid #ddd;
    border-radius:7px;background:#fff;color:#888;cursor:pointer;">↻</button>
</div>

<div id="wrap">
  <div id="alarmen"></div>
  <div id="lijst"></div>
  <button class="knop-nieuw" onclick="openModal()">+ Medicijn toevoegen</button>
</div>

<div class="overlay" id="modal" onclick="if(event.target===this)sluit()">
  <div class="modal">
    <div class="m-titel" id="m-titel">Medicijn</div>
    <div class="fg">
      <label class="fl">Naam en sterkte</label>
      <input class="fi" id="f-naam" type="text" placeholder="bijv. Losartan 50 mg" autocomplete="off">
    </div>
    <div class="fg duo">
      <div>
        <label class="fl">Per dag</label>
        <input class="fi" id="f-doses" type="number" step="0.5" min="0" value="1">
        <div class="hint">0,5 = om de dag</div>
      </div>
      <div>
        <label class="fl">Eenheid</label>
        <input class="fi" id="f-eenheid" type="text" value="tablet">
      </div>
    </div>
    <div class="fg duo">
      <div>
        <label class="fl">Per doosje</label>
        <input class="fi" id="f-perdoos" type="number" min="1" value="28">
        <div class="hint">aantal in één verpakking van de apotheek</div>
      </div>
      <div>
        <label class="fl">Weekdoosje dekt</label>
        <input class="fi" id="f-duur" type="number" min="1" value="28">
        <div class="hint">dagen per vulling</div>
      </div>
    </div>
    <div class="fg duo">
      <div>
        <label class="fl">Nu in huis</label>
        <input class="fi" id="f-thuis" type="number" min="0" value="0">
        <div class="hint">losse eenheden, ook die in het doosje</div>
      </div>
      <div>
        <label class="fl">Bij apotheek</label>
        <input class="fi" id="f-apo" type="number" min="0" value="0">
        <div class="hint">doosjes klaar / voorgeschreven</div>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Opmerking</label>
      <input class="fi" id="f-opm" type="text" autocomplete="off">
    </div>
    <div class="knoppen">
      <button class="bs" onclick="sluit()">Annuleren</button>
      <button class="bp" onclick="bewaarMed()">Bewaren</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Concierge — medicatie
   Kernregels:
   - de voorraad thuis wordt in EENHEDEN (pillen) geteld
   - het weekdoosje vullen verandert de thuisvoorraad NIET;
     die pillen lagen al in huis
   - wat telt is: heb ik op de volgende vuldatum genoeg om
     het doosje vol te krijgen? Zo niet: eerst naar de apotheek
   ============================================================ */

/* hoeveel dagen vóór de vuldatum we waarschuwen dat er te weinig in huis is —
   ruim genoeg om nog langs de apotheek te kunnen                            */
const VERWITTIG_DAGEN = 7;

const PERSOON = 'medicatie_bea';
const REPO = 'PierreHeysselaer/piheys_repository';
const TOKEN = ['github_pat_11AYGGRYA0mx','BmzBHFY6TP_XD','TD4hfTIO1fvuM2paNJ7R1OT',
               'qXyBYmOo1ajP7nPoIY4IQAOPI5MKdiSTkP'].join('');
const API = n => `https://api.github.com/repos/${REPO}/contents/${n}`;
const H = () => ({Authorization:`Bearer ${TOKEN}`, Accept:'application/vnd.github.v3+json'});
const MIJN = [PERSOON];

let STATUS = null, sha = null, bezig = false, nogEens = false, bewerkId = null;

const dstr = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const VANDAAG = dstr(new Date());
function plusDagen(s,n){ const d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return dstr(d); }
function dagenTussen(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); }
function toonDatum(s){ if(!s) return '—'; const d=new Date(s+'T12:00:00');
  return `${d.getDate()}/${d.getMonth()+1}`; }
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function b64(t){ const by=new TextEncoder().encode(t); let s=''; by.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); }
function vanB64(c){ return new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,'')), x=>x.charCodeAt(0))); }
function setSync(k,t){ document.getElementById('dot').className='sync-dot '+k;
                       document.getElementById('sync').textContent=t; }

async function haalJson(naam){
  const r = await fetch(API(naam)+'?t='+Date.now(), {headers:H(), cache:'no-store'});
  if (r.status===404) return null;
  if (!r.ok) throw new Error(naam+': '+r.status);
  const j = await r.json();
  return {sha:j.sha, data:JSON.parse(vanB64(j.content))};
}

async function laadAlles(){
  setSync('bezig','laden…');
  try {
    const s = await haalJson('status.json');
    STATUS = s ? s.data : {};
    sha    = s ? s.sha  : null;
    if (!STATUS[PERSOON]) STATUS[PERSOON] = [];
    setSync('ok','gesynchroniseerd');
  } catch(e){ setSync('fout','fout bij laden'); console.error(e); }
  teken();
}

/* ---- opslaan met conflictafhandeling (dit was de bug) ---- */
async function bewaarStatus(){
  if (bezig){ nogEens = true; return; }
  bezig = true; setSync('bezig','opslaan…');
  try {
    for (let poging=0; poging<4; poging++){
      STATUS.gewijzigd = new Date().toISOString();
      const body = {message:'medicatie', content:b64(JSON.stringify(STATUS,null,1))};
      if (sha) body.sha = sha;
      const r = await fetch(API('status.json'), {
        method:'PUT', headers:{...H(),'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if (r.ok){
        sha = (await r.json()).content.sha;
        setSync('ok','opgeslagen ✓');
        setTimeout(()=>setSync('ok','gesynchroniseerd'), 2200);
        return;
      }
      if (r.status===409 || r.status===422){
        const vers = await haalJson('status.json');
        if (vers){
          sha = vers.sha;
          for (const k of MIJN) vers.data[k] = STATUS[k];
          STATUS = vers.data;
        }
        continue;
      }
      throw new Error(r.status);
    }
    setSync('fout','opslaan lukt niet');
  } catch(e){ setSync('fout','fout'); console.error(e); }
  finally { bezig=false; if(nogEens){ nogEens=false; bewaarStatus(); } }
}

/* ============================================================
   BEREKENINGEN
   ============================================================ */
function meds(){ return STATUS[PERSOON] || []; }

/* wat ligt er nu werkelijk in huis? de opgegeven stand min het
   verbruik sinds die stand werd genoteerd                      */
function voorraadNu(m, opDatum){
  const d = opDatum || VANDAAG;
  const basis = +m.stock_thuis || 0;
  const vanaf = m.stock_bijgewerkt_op || d;
  const dagen = Math.max(0, dagenTussen(vanaf, d));
  return Math.max(0, basis - dagen * (+m.doses_per_dag || 0));
}

function rekening(m){
  const perDag   = +m.doses_per_dag || 0;
  const perDoos  = +m.units_per_doos || 28;
  const duur     = +m.doosje_duur || 28;
  const dozenApo = +m.dozen_apotheek || 0;

  const nu       = voorraadNu(m);
  const totaal   = nu + dozenApo * perDoos;
  const dagenOp  = perDag > 0 ? Math.floor(totaal / perDag) : 9999;
  const opDatum  = plusDagen(VANDAAG, dagenOp);

  /* het weekdoosje */
  const gevuld   = m.doosje_gevuld_op || null;
  const vuldatum = gevuld ? plusDagen(gevuld, duur) : VANDAAG;
  const totVullen= dagenTussen(VANDAAG, vuldatum);
  const nodig    = Math.ceil(duur * perDag);
  const bijVullen= voorraadNu(m, totVullen > 0 ? vuldatum : VANDAAG);
  const tekort   = Math.max(0, nodig - Math.floor(bijVullen));

  return {perDag, perDoos, duur, dozenApo, nu:Math.floor(nu), totaal:Math.floor(totaal),
          dagenOp, opDatum, vuldatum, totVullen, nodig, tekort};
}

/* ============================================================
   TEKENEN
   ============================================================ */
function teken(){
  const lijst = document.getElementById('lijst');
  const L = meds();
  if (!L.length){
    lijst.innerHTML = '<div class="leeg">Nog geen medicijnen toegevoegd.</div>';
    document.getElementById('alarmen').innerHTML = '';
    return;
  }

  /* --- alarmen bovenaan --- */
  const bijnaOp = [], tekorten = [];
  for (const m of L){
    const r = rekening(m);
    if (r.dagenOp < 14) bijnaOp.push({m, r});
    if (r.tekort > 0 && r.totVullen <= VERWITTIG_DAGEN) tekorten.push({m, r});
  }
  let a = '';
  if (tekorten.length){
    const eerste = tekorten.reduce((x,y)=>x.r.totVullen<y.r.totVullen?x:y);
    a += `<div class="alarm oranje">
      <b>Apotheekbezoek nodig vóór ${toonDatum(eerste.r.vuldatum)}</b><br>
      Bij het vullen van het doosje kom je tekort:
      <ul>${tekorten.map(t=>`<li>${esc(t.m.naam)} — ${t.r.tekort} ${esc(t.m.eenheid)}
        te weinig op ${toonDatum(t.r.vuldatum)}</li>`).join('')}</ul>
      Ga er vóór die datum langs, dan kun je in één keer vullen.</div>`;
  }
  if (bijnaOp.length){
    a += `<div class="alarm rood"><b>Voorraad raakt op</b>
      <ul>${bijnaOp.map(x=>`<li>${esc(x.m.naam)} — nog ${x.r.dagenOp} dagen
        (tot ${toonDatum(x.r.opDatum)})</li>`).join('')}</ul></div>`;
  }
  document.getElementById('alarmen').innerHTML = a;

  /* --- kaarten --- */
  lijst.innerHTML = L.map((m, i)=>{
    const r = rekening(m);
    const kleur = r.dagenOp > 30 ? 'groen' : r.dagenOp > 14 ? 'oranje' : 'rood';
    const krap  = r.dagenOp <= 14 || r.tekort > 0;

    let doosjeTekst, vulKlaar = false;
    if (!m.doosje_gevuld_op){
      doosjeTekst = 'Pillendoosje nog nooit gevuld.';
      vulKlaar = true;
    } else if (r.totVullen > 0){
      doosjeTekst = `Gevuld op <b>${toonDatum(m.doosje_gevuld_op)}</b> ·
                     volgende vulling <b>${toonDatum(r.vuldatum)}</b>
                     — nog ${r.totVullen} dag${r.totVullen===1?'':'en'}.`;
      vulKlaar = r.totVullen <= 2;
    } else if (r.totVullen === 0){
      doosjeTekst = '<b>Vandaag het doosje opnieuw vullen</b> — het is leeg.';
      vulKlaar = true;
    } else {
      doosjeTekst = `<b>Vullen is ${-r.totVullen} dag${r.totVullen===-1?'':'en'} over tijd.</b>`;
      vulKlaar = true;
    }

    const waarschuwing = r.tekort > 0
      ? `<div class="waarschuw">Op ${toonDatum(r.vuldatum)} kom je ${r.tekort}
         ${esc(m.eenheid)} tekort — dan blijven er vakjes leeg. Eerst langs de apotheek.</div>` : '';

    return `<div class="med${krap?' krap':''}">
      <div class="med-kop">
        <div>
          <div class="med-naam">${esc(m.naam)}</div>
          <div class="med-sub">${m.doses_per_dag} ${esc(m.eenheid)}${m.doses_per_dag==1?'':'s'} per dag
            · ${m.units_per_doos} per doosje${m.opm?' · '+esc(m.opm):''}</div>
        </div>
        <span class="tot ${kleur}">${r.dagenOp>=999?'ruim':r.dagenOp+' d'}</span>
      </div>

      <div class="rij">
        <div class="rij-label">In huis
          <small>voorraad tot ${toonDatum(r.opDatum)}</small></div>
        <div class="rij-waarde tikbaar" onclick="tel(${i})" title="tik om het juiste aantal in te geven">${r.nu}</div>
        <div class="knopjes">
          <button class="kn" onclick="pas(${i},-1)">−</button>
          <button class="kn" onclick="pas(${i},1)">+</button>
          <button class="kn breed" onclick="tel(${i})">tel</button>
        </div>
      </div>

      <div class="rij">
        <div class="rij-label">Bij de apotheek
          <small>${r.dozenApo} doosje${r.dozenApo===1?'':'s'} = ${r.dozenApo*r.perDoos} ${esc(m.eenheid)}</small></div>
        <div class="rij-waarde">${r.dozenApo}</div>
        <div class="knopjes">
          <button class="kn" onclick="apo(${i},-1)">−</button>
          <button class="kn" onclick="apo(${i},1)">+</button>
          <button class="kn breed" onclick="afgehaald(${i})">afgehaald</button>
        </div>
      </div>

      <div class="doosje">
        <div class="doosje-rij">
          <div class="doosje-tekst">${doosjeTekst}</div>
          <button class="vul-knop${vulKlaar?'':' uit'}" onclick="vulDoosje(${i})">Doosje gevuld</button>
        </div>
        ${waarschuwing}
      </div>

      <div class="acties">
        <button class="mini" onclick="bewerk(${i})">Bewerken</button>
        <button class="mini" onclick="verwijder(${i})">Verwijderen</button>
      </div>
    </div>`;
  }).join('');
}

/* ============================================================
   ACTIES
   ============================================================ */

/* +/− werken op de HUIDIGE stand en zetten meteen de peildatum
   op vandaag — anders zou de correctie terugvallen op de oude stand */
function pas(i, delta){
  const m = meds()[i];
  m.stock_thuis = Math.max(0, Math.round(voorraadNu(m) + delta));
  m.stock_bijgewerkt_op = VANDAAG;
  teken(); bewaarStatus();
}
function tel(i){
  const m = meds()[i];
  const v = prompt(`Hoeveel ${m.eenheid}s liggen er nu in huis?\n(inclusief wat in het weekdoosje zit)`,
                   Math.floor(voorraadNu(m)));
  if (v === null) return;
  const n = parseInt(v);
  if (isNaN(n) || n < 0) return;
  m.stock_thuis = n;
  m.stock_bijgewerkt_op = VANDAAG;
  teken(); bewaarStatus();
}
function apo(i, delta){
  const m = meds()[i];
  m.dozen_apotheek = Math.max(0, (+m.dozen_apotheek||0) + delta);
  teken(); bewaarStatus();
}
/* doosje bij de apotheek opgehaald: verhuist naar de voorraad thuis */
function afgehaald(i){
  const m = meds()[i];
  if ((+m.dozen_apotheek||0) < 1) return;
  m.stock_thuis = Math.round(voorraadNu(m) + (+m.units_per_doos||28));
  m.stock_bijgewerkt_op = VANDAAG;
  m.dozen_apotheek = (+m.dozen_apotheek||0) - 1;
  teken(); bewaarStatus();
}
/* het doosje vullen verandert de voorraad NIET — die pillen lagen al in huis */
function vulDoosje(i){
  const m = meds()[i];
  m.doosje_gevuld_op = VANDAAG;
  teken(); bewaarStatus();
}
function verwijder(i){
  const m = meds()[i];
  if (!confirm(`"${m.naam}" verwijderen?`)) return;
  STATUS[PERSOON].splice(i,1);
  teken(); bewaarStatus();
}

/* ---------- modal ---------- */
function openModal(){
  bewerkId = null;
  document.getElementById('m-titel').textContent = 'Nieuw medicijn';
  document.getElementById('f-naam').value='';
  document.getElementById('f-doses').value='1';
  document.getElementById('f-eenheid').value='tablet';
  document.getElementById('f-perdoos').value='28';
  document.getElementById('f-duur').value='28';
  document.getElementById('f-thuis').value='0';
  document.getElementById('f-apo').value='0';
  document.getElementById('f-opm').value='';
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('f-naam').focus(),150);
}
function bewerk(i){
  const m = meds()[i];
  bewerkId = m.id;
  document.getElementById('m-titel').textContent = 'Medicijn bewerken';
  document.getElementById('f-naam').value    = m.naam || '';
  document.getElementById('f-doses').value   = m.doses_per_dag ?? 1;
  document.getElementById('f-eenheid').value = m.eenheid || 'tablet';
  document.getElementById('f-perdoos').value = m.units_per_doos ?? 28;
  document.getElementById('f-duur').value    = m.doosje_duur ?? 28;
  document.getElementById('f-thuis').value   = Math.floor(voorraadNu(m));
  document.getElementById('f-apo').value     = m.dozen_apotheek ?? 0;
  document.getElementById('f-opm').value     = m.opm || '';
  document.getElementById('modal').classList.add('open');
}
function sluit(){ document.getElementById('modal').classList.remove('open'); }

function bewaarMed(){
  const naam = document.getElementById('f-naam').value.trim();
  if (!naam){ document.getElementById('f-naam').focus(); return; }
  const veld = {
    naam,
    doses_per_dag : parseFloat(document.getElementById('f-doses').value) || 1,
    eenheid       : document.getElementById('f-eenheid').value.trim() || 'tablet',
    units_per_doos: parseInt(document.getElementById('f-perdoos').value) || 28,
    doosje_duur   : parseInt(document.getElementById('f-duur').value) || 28,
    stock_thuis   : parseInt(document.getElementById('f-thuis').value) || 0,
    dozen_apotheek: parseInt(document.getElementById('f-apo').value) || 0,
    opm           : document.getElementById('f-opm').value.trim(),
    stock_bijgewerkt_op: VANDAAG
  };
  if (bewerkId){
    const m = meds().find(x=>x.id===bewerkId);
    Object.assign(m, veld);
  } else {
    STATUS[PERSOON].push({id:'m_'+Date.now(), doosje_gevuld_op:null, ...veld});
  }
  sluit(); teken(); bewaarStatus();
}

laadAlles();
